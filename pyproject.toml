[project]
name = "nextbot"
version = "0.1.0"
description = "nextbot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[websockets]>=2.4.4",
    "nonebot-adapter-console>=0.9.0",
    "SQLAlchemy>=2.0.0",
    "httpx>=0.27.0",
    "nonebot-adapter-onebot>=2.4.6",
    "playwright>=1.58.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "tzdata>=2025.3",
    "bcrypt>=4.0.0",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]",
    "ruff"
]

[project.dependency-groups]
dev = [
    "pyright",
    "ruff",
]
[tool.nonebot]
plugin_dirs = ["nextbot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-console = [{name = "Console", module_name = "nonebot.adapters.console"}]
nonebot-adapter-onebot = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]

[tool.nonebot.plugins]
"@local" = []
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

[tool.ruff.lint.per-file-ignores]
# 测试：断言里的数值阈值（PNG 大小等）、独立运行时的诊断 print 都是测试常规用法。
"tests/*" = ["PLR2004", "T201", "S101"]
# 渲染模块的数学 / 编解码代码：保留与规格 / 字节码源一致的命名与字面量，不做无谓改名。
# image_io.py 是 8-bit RGBA PNG 编解码器：filter type / bit-depth / color-type
# 等都是 PNG 规范里的固定整型字面量（0/1/2/3/4/6/8），抽成常量只会降低可读性。
"nextbot/terraria_render/image_io.py" = ["PLR2004"]
# dye.py 精确移植反编译出的 ps_2_0 着色器 + D3DX preshader：单字母数学变量
# （M=max、m=min、S=max+min、D=chroma）与 uColor / uSat / uSecondary 直接对应
# 着色器源里的常量名，改成蛇形会破坏与 dye_shader_spec 的逐行对照。
# - ANN001：内层 f(r,g,b,a) 闭包/ lambda 形参都是 numpy 数组，对应着色器寄存器，
#   标注 np.ndarray 只是噪音。
# - ARG001/ARG005：动画 / 噪声 pass 在静态近似里折叠了 uTime / uSecondary / uSat 等
#   uniform，但保留完整签名以忠实记录真实着色器输入（见 spec §0 / §全局 uniforms）。
# - RUF059：解包占位变量（h_ 等）。E501：保持与字节码逐行对照的着色器数学长行。
# - C901 / PLR09xx：apply_dye 是按 pass 名分派的扁平派发表，分支多但无逻辑嵌套；
#   _recolor_premul 形参对应 preshader 常量，拆分反而失真。
"nextbot/terraria_render/dye.py" = [
    "PLR2004", "N803", "N806", "ANN001", "ARG001", "ARG005",
    "RUF059", "E501", "C901", "PLR0911", "PLR0912", "PLR0913",
]
# _build/* 是一次性离线工具（XNB/LZX 解码器、资源/查表生成脚本），不进运行时。
# lzx_xnb.py 是 cabextract/MonoGame LZX 解码器的忠实移植，R0/R1/R2/PRETREE_len
# 等是该算法的规范命名；脚本通过 print 输出 CLI 诊断，用 os.path 即可。
"nextbot/terraria_render/_build/*" = [
    "N806", "N803", "T201", "PTH", "PLR2004", "TRY003", "SIM115", "ANN",
    "RUF059", "BLE001", "E501", "C901", "PLR0912", "PLR0913", "PLR0915", "ARG002",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
