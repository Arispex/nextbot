<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 奖池列表</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .entry {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .entry-top {
      display: flex;
      /* center, not baseline — keeps small pills optically aligned with the
       * larger name baseline (matches shop / warehouse decision). */
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .entry-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* ── Pills: amber=ID, teal=count, primary=cost (gacha is "premium" so
     *    cost gets the strongest accent — coral). ─────────────────── */
    .id-pill,
    .count-pill,
    .cost-pill {
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
      font-feature-settings: "tnum";
    }

    .id-pill {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    .count-pill {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    .cost-pill {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    .entry-desc {
      color: var(--color-muted);
      font-size: var(--type-body-sm-size);
      line-height: 1.55;
    }

    .entry-cmd {
      margin-left: auto;
      font-family: var(--font-code);
      font-size: 12px;
      color: var(--color-muted-soft);
      font-feature-settings: "tnum";
      white-space: nowrap;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div id="header-eyebrow" class="header-eyebrow type-caption-uppercase"></div>
      <h1 id="header-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span id="header-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>暂无可用奖池</div>

    <section id="list" class="list"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="lottery-list-data" type="application/json">__LOTTERY_LIST_DATA_JSON__</script>
  <script>
    const data = (() => {
      try { return JSON.parse(document.getElementById("lottery-list-data").textContent); }
      catch (err) { console.warn("[render] page data unavailable", err); return {}; }
    })();
    const entries = Array.isArray(data.entries) ? data.entries : [];
    const total = Number(data.total || entries.length || 0);
    const totalPages = Number(data.total_pages || 1);
    const page = Number(data.page || 1);

    document.getElementById("header-eyebrow").textContent = "抽奖系统";
    document.getElementById("header-title").textContent = "奖池列表";
    document.getElementById("header-count").textContent = `共 ${total} 个上架奖池`;
    document.getElementById("header-page").textContent = `第 ${page} / ${totalPages} 页`;
    document.getElementById("header-generated-at").textContent = data.generated_at || "";

    const listEl = document.getElementById("list");

    if (!entries.length) {
      document.getElementById("empty-state").hidden = false;
      listEl.hidden = true;
    }

    for (const entry of entries) {
      const card = document.createElement("article");
      card.className = "entry";

      const top = document.createElement("div");
      top.className = "entry-top";

      const nameEl = document.createElement("h2");
      nameEl.className = "entry-name type-title-md";
      nameEl.textContent = String(entry?.name || "").trim() || "未命名奖池";
      top.appendChild(nameEl);

      const idBadge = document.createElement("span");
      idBadge.className = "id-pill";
      idBadge.textContent = `ID ${entry?.pool_id ?? "-"}`;
      top.appendChild(idBadge);

      const countBadge = document.createElement("span");
      countBadge.className = "count-pill";
      countBadge.textContent = `${Number(entry?.prize_count || 0)} 件奖品`;
      top.appendChild(countBadge);

      const costBadge = document.createElement("span");
      costBadge.className = "cost-pill";
      costBadge.textContent = `${Number(entry?.cost_per_draw || 0)} 金币 / 次`;
      top.appendChild(costBadge);

      const cmdHint = document.createElement("span");
      cmdHint.className = "entry-cmd";
      cmdHint.textContent = `查看奖池 ${entry?.pool_id ?? ""}`.trim();
      top.appendChild(cmdHint);

      card.appendChild(top);

      const descText = String(entry?.description || "").trim();
      if (descText) {
        const desc = document.createElement("div");
        desc.className = "entry-desc";
        desc.textContent = descText;
        card.appendChild(desc);
      }

      listEl.appendChild(card);
    }
  </script>
</body>
</html>
