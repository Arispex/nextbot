<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 用户信息</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    /* ── Global reset & canvas ─────────────────────────────── */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html,
    body { margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Page frame ────────────────────────────────────────── */
    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header ────────────────────────────────────────────── */
    /* No header-rule: the avatar + serif name already serve as the visual
     * hero anchor on this page. The coral rule is reserved for text-only
     * hero pages (menu, leaderboard) where there's no visual element to
     * carry that weight. */
    .header {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .header-meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--space-xxs);
    }

    .name-row {
      display: flex;
      align-items: baseline;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .user-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .group-badge {
      background-color: var(--color-surface-card);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-pill);
      padding: var(--space-xxs) var(--space-sm);
    }

    .user-id {
      color: var(--color-muted);
      font-family: var(--font-code);
    }

    .reg-time {
      color: var(--color-muted-soft);
    }

    /* ── Stats grid ────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
      /* All cards stretch to the tallest card's height (the perm card
       * grows with badge count). Short cards keep their content top-aligned
       * with breathing room below — consistent row baseline beats variable
       * card heights. */
    }

    .stat-card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      min-width: 0;
    }

    .stat-label {
      color: var(--color-muted);
    }

    /* Override the default editorial-serif treatment for stat values:
     * Cormorant Garamond uses old-style figures ("120" reads as "I2O") which
     * destroys glance-readability for data. Keep the 28px scale + slight
     * negative tracking for editorial weight, but switch to humanist sans
     * with tabular numerals for legibility. */
    .stat-value {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      font-feature-settings: "tnum";
      color: var(--color-ink);
      margin: 0;
      /* R4R-polish：MAX_COINS bump 到 100 亿后单格数字最长可达 14 字符（含千分位），
       * 用 break-all 强制对长数字串换行（word-break: break-word 在 Chromium 行为不一致）。 */
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .stat-unit {
      font-weight: 400;
      letter-spacing: 0;
      color: var(--color-muted);
      margin-left: var(--space-xxs);
    }

    /* ── Permissions list (overflow stat-card) ─────────────── */
    .perm-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xxs);
      margin-top: var(--space-xxs);
    }

    .perm-badge {
      background-color: var(--color-canvas);
      color: var(--color-body);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .perm-empty {
      color: var(--color-muted-soft);
    }

    /* ── Contribution wall ─────────────────────────────────── */
    .wall-card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
    }

    .wall-title {
      color: var(--color-muted);
      margin-bottom: var(--space-sm);
    }

    .wall-body {
      display: flex;
      gap: var(--space-xs);
    }

    .wall-day-labels {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      color: var(--color-muted-soft);
      font-family: var(--font-body);
      font-size: 10px;
      line-height: 1;
    }

    .wall-cols {
      display: flex;
      min-width: 0;
      flex: 1;
      flex-direction: column;
      gap: 2px;
    }

    .wall-months {
      color: var(--color-muted-soft);
      font-family: var(--font-body);
      font-size: 10px;
      white-space: nowrap;
    }

    /* ── Footer ────────────────────────────────────────────── */
    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- Header (sits directly on canvas; no rule, avatar is the visual anchor) -->
    <header class="header">
      <img id="user-avatar" class="avatar" alt="avatar" />
      <div class="header-meta">
        <div class="name-row">
          <h1 id="user-name" class="user-name type-display-md"></h1>
          <span id="group-badge" class="group-badge type-caption"></span>
        </div>
        <div id="user-id" class="user-id type-body-sm"></div>
        <div id="reg-time" class="reg-time type-body-sm"></div>
      </div>
    </header>

    <!-- Stats: 4 individual feature-cards -->
    <section class="stats">
      <div class="stat-card">
        <div class="stat-label type-caption-uppercase">金币</div>
        <div id="stat-coins" class="stat-value"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label type-caption-uppercase">累计签到</div>
        <div class="stat-value">
          <span id="stat-sign-total"></span><span class="stat-unit">次</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label type-caption-uppercase">连续签到</div>
        <div class="stat-value">
          <span id="stat-sign-streak"></span><span class="stat-unit">天</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label type-caption-uppercase">权限</div>
        <div id="stat-permissions" class="perm-list"></div>
      </div>
    </section>

    <!-- Contribution wall: an individual feature-card -->
    <section class="wall-card">
      <div class="wall-title type-caption-uppercase">签到记录</div>
      <div class="wall-body">
        <div id="wall-day-labels" class="wall-day-labels"></div>
        <div class="wall-cols">
          <div id="wall-months" class="wall-months"></div>
          <div id="wall-grid"></div>
        </div>
      </div>
    </section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="user-info-data" type="application/json">__USER_INFO_DATA_JSON__</script>
  <script>
    const data = JSON.parse(document.getElementById("user-info-data").textContent);

    // Header
    document.getElementById("user-avatar").src =
      `http://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(data.user_id || "")}&s=100`;
    document.getElementById("user-name").textContent = data.user_name || "—";
    document.getElementById("user-id").textContent = `QQ：${data.user_id || ""}`;
    document.getElementById("group-badge").textContent = data.group || "guest";
    document.getElementById("reg-time").textContent = `注册时间：${data.created_at || ""}`;

    // Stats
    document.getElementById("stat-coins").textContent =
      Number(data.coins || 0).toLocaleString("zh-CN");
    document.getElementById("stat-sign-total").textContent = data.sign_total ?? 0;
    document.getElementById("stat-sign-streak").textContent = data.sign_streak ?? 0;

    // Permissions
    const permWrap = document.getElementById("stat-permissions");
    const perms = String(data.permissions || "").split(",").map(s => s.trim()).filter(Boolean);
    if (perms.length) {
      for (const p of perms) {
        const b = document.createElement("span");
        b.className = "perm-badge";
        b.textContent = p;
        permWrap.appendChild(b);
      }
    } else {
      const none = document.createElement("span");
      none.className = "perm-empty type-caption";
      none.textContent = "无";
      permWrap.appendChild(none);
    }

    // Contribution wall
    const signSet = new Set(Array.isArray(data.sign_dates) ? data.sign_dates : []);
    const days = Math.max(7, Math.min(Number(data.days || 90), 365));

    const toDateStr = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const rangeStart = new Date(today);
    rangeStart.setDate(rangeStart.getDate() - (days - 1));

    // Align to Monday so the wall reads top-to-bottom Mon..Sun.
    const dow = (rangeStart.getDay() + 6) % 7;
    const wallStart = new Date(rangeStart);
    wallStart.setDate(wallStart.getDate() - dow);

    const weeks = [];
    const monthCols = {};
    const seenMonths = new Set();
    let cur = new Date(wallStart);
    let col = 0;
    while (cur <= today) {
      const week = [];
      for (let r = 0; r < 7; r++) {
        const ds = toDateStr(cur);
        const afterToday = cur > today;
        const inRange = cur >= rangeStart && !afterToday;
        if (r === 0) {
          const monthKey = `${cur.getFullYear()}-${cur.getMonth()}`;
          if (!seenMonths.has(monthKey)) {
            seenMonths.add(monthKey);
            monthCols[col] = `${cur.getMonth() + 1}月`;
          }
        }
        week.push({ ds, signed: signSet.has(ds), inRange, afterToday });
        const next = new Date(cur);
        next.setDate(next.getDate() + 1);
        cur = next;
      }
      weeks.push(week);
      col++;
    }

    const gap = 2;
    const cellH = 11;
    const numCols = weeks.length;

    // Month labels row
    const monthsEl = document.getElementById("wall-months");
    monthsEl.style.display = "grid";
    monthsEl.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
    monthsEl.style.gap = `${gap}px`;
    monthsEl.style.height = `${cellH}px`;
    monthsEl.style.lineHeight = `${cellH}px`;
    monthsEl.style.overflow = "visible";
    weeks.forEach((_, ci) => {
      const span = document.createElement("span");
      span.style.whiteSpace = "nowrap";
      span.style.overflow = "visible";
      span.textContent = monthCols[ci] || "";
      monthsEl.appendChild(span);
    });

    // Day labels (Mon/Wed/Fri shown on rows 0/2/4)
    const dayLabelsEl = document.getElementById("wall-day-labels");
    const DAY_LABELS = ["周一", "", "周三", "", "周五", "", "周日"];
    const topSpacer = document.createElement("div");
    topSpacer.style.height = `${cellH + gap}px`;
    dayLabelsEl.appendChild(topSpacer);
    DAY_LABELS.forEach((label, i) => {
      const span = document.createElement("span");
      span.style.height = `${cellH}px`;
      span.style.lineHeight = `${cellH}px`;
      span.style.display = "block";
      span.style.whiteSpace = "nowrap";
      if (i > 0) span.style.marginTop = `${gap}px`;
      span.textContent = label;
      dayLabelsEl.appendChild(span);
    });

    // Grid
    const gridEl = document.getElementById("wall-grid");
    gridEl.style.display = "grid";
    gridEl.style.gridTemplateRows = `repeat(7, ${cellH}px)`;
    gridEl.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
    gridEl.style.gridAutoFlow = "column";
    gridEl.style.gap = `${gap}px`;

    const COLOR_EMPTY = getComputedStyle(document.documentElement)
      .getPropertyValue("--color-hairline").trim() || "#e6dfd8";
    const COLOR_SIGNED = getComputedStyle(document.documentElement)
      .getPropertyValue("--color-accent-teal").trim() || "#5db8a6";

    weeks.forEach(week => {
      week.forEach(({ ds, signed, inRange, afterToday }) => {
        if (afterToday) return;
        const cell = document.createElement("div");
        cell.style.borderRadius = "2px";
        cell.style.backgroundColor = signed ? COLOR_SIGNED : COLOR_EMPTY;
        if (inRange) cell.title = `${ds}${signed ? " ✓" : ""}`;
        gridEl.appendChild(cell);
      });
    });
  </script>
</body>
</html>
