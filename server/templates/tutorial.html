<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 教程</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-subtitle {
      color: var(--color-muted);
      font-size: var(--type-body-md-size);
      max-width: 720px;
      margin-bottom: var(--space-xs);
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .step {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      font-feature-settings: "tnum";
      flex-shrink: 0;
    }

    .step-title {
      color: var(--color-ink);
      font-weight: 600;
      font-size: 18px;
      line-height: 1.3;
    }

    .step-desc {
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ── Chat mock ────────────────────────────────────────── */
    .chat {
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: var(--space-xs);
    }

    .chat-header {
      background-color: var(--color-surface-soft);
      border-bottom: 1px solid var(--color-hairline);
      padding: var(--space-xs) var(--space-md);
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .chat-body {
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .chat-row {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
    }

    .chat-row.user {
      flex-direction: row-reverse;
    }

    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      color: var(--color-primary);
      flex-shrink: 0;
      overflow: hidden;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-stack {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: calc(100% - 60px);
    }

    .chat-row.user .chat-stack {
      align-items: flex-end;
    }

    .chat-nick {
      color: var(--color-muted-soft);
      font-size: 10px;
      font-weight: 500;
      padding: 0 4px;
    }

    .chat-bubble {
      padding: 8px var(--space-sm);
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 100%;
    }

    .chat-bubble.bot {
      background-color: var(--color-surface-card);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
    }

    .chat-bubble.user {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border: 1px solid var(--color-primary);
    }

    /* ── Tip box (4-tier semantic) ────────────────────────── */
    .tip {
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid transparent;
      margin-top: var(--space-xs);
    }

    .tip.warn {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    .tip.hint {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    .tip.info {
      background-color: var(--color-surface-soft);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }

    .tip-label {
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 10px;
      margin-right: var(--space-xs);
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 id="tut-title" class="header-title type-display-lg"></h1>
      <div id="tut-subtitle" class="header-subtitle" hidden></div>
      <div class="header-meta type-body-sm">
        <span id="tut-time"></span>
      </div>
    </header>

    <section id="steps" class="steps"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="tut-data" type="application/json">__TUTORIAL_DATA_JSON__</script>
  <script>
    (function () {
      const data = (() => {
        try { return JSON.parse(document.getElementById("tut-data").textContent); }
        catch (err) { console.warn("[render] page data unavailable", err); return {}; }
      })();
      const steps = Array.isArray(data.steps) ? data.steps : [];

      // Title — drop emoji prefix per warm-canvas convention.
      document.getElementById("tut-title").textContent = String(data.title || "教程").trim() || "教程";
      const subtitle = String(data.subtitle || "").trim();
      if (subtitle) {
        const subEl = document.getElementById("tut-subtitle");
        subEl.textContent = subtitle;
        subEl.hidden = false;
      }
      document.getElementById("tut-time").textContent = String(data.generated_at || "");

      const stepsEl = document.getElementById("steps");

      const TIP_LABEL = { warn: "注意", hint: "提示", info: "说明" };

      steps.forEach((step, i) => {
        const card = document.createElement("article");
        card.className = "step";

        const head = document.createElement("div");
        head.className = "step-head";
        const num = document.createElement("div");
        num.className = "step-number";
        num.textContent = String(step.index || (i + 1));
        head.appendChild(num);
        const title = document.createElement("div");
        title.className = "step-title";
        title.textContent = String(step.title || "");
        head.appendChild(title);
        card.appendChild(head);

        const descText = String(step.desc || "");
        if (descText) {
          const desc = document.createElement("div");
          desc.className = "step-desc";
          desc.textContent = descText;
          card.appendChild(desc);
        }

        const chat = Array.isArray(step.chat) ? step.chat : [];
        if (chat.length > 0) {
          const chatWrap = document.createElement("div");
          chatWrap.className = "chat";

          const chatHeader = document.createElement("div");
          chatHeader.className = "chat-header";
          chatHeader.textContent = "模拟对话";
          chatWrap.appendChild(chatHeader);

          const chatBody = document.createElement("div");
          chatBody.className = "chat-body";

          chat.forEach((msg) => {
            const isUser = String(msg.role || "") === "user";
            const row = document.createElement("div");
            row.className = "chat-row " + (isUser ? "user" : "bot");

            const avatar = document.createElement("div");
            avatar.className = "chat-avatar";
            const avatarSrc = String(msg.avatar || "");
            if (avatarSrc === "__BOT__") {
              avatar.textContent = "B";
            } else if (avatarSrc) {
              const img = document.createElement("img");
              img.src = avatarSrc;
              img.alt = "";
              avatar.appendChild(img);
            } else {
              avatar.textContent = isUser ? "U" : "B";
            }
            row.appendChild(avatar);

            const stack = document.createElement("div");
            stack.className = "chat-stack";

            const nameStr = String(msg.name || "").trim();
            if (nameStr) {
              const nick = document.createElement("div");
              nick.className = "chat-nick";
              nick.textContent = nameStr;
              stack.appendChild(nick);
            }

            const bubble = document.createElement("div");
            bubble.className = "chat-bubble " + (isUser ? "user" : "bot");
            bubble.textContent = String(msg.text || "");
            stack.appendChild(bubble);

            row.appendChild(stack);
            chatBody.appendChild(row);
          });

          chatWrap.appendChild(chatBody);
          card.appendChild(chatWrap);
        }

        if (step.tip && typeof step.tip === "object") {
          const kind = String(step.tip.type || "info");
          const cls = (kind === "warn" || kind === "hint") ? kind : "info";
          const tip = document.createElement("div");
          tip.className = "tip " + cls;
          const label = document.createElement("span");
          label.className = "tip-label";
          label.textContent = TIP_LABEL[cls] || "说明";
          tip.appendChild(label);
          tip.appendChild(document.createTextNode(String(step.tip.text || "")));
          card.appendChild(tip);
        }

        stepsEl.appendChild(card);
      });
    })();
  </script>
</body>
</html>
