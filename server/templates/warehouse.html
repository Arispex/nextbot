<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 仓库</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text hero — rule + eyebrow + serif title, like menu page).
     * Owner info drops to a byline row below the title — distinguishes
     * this page from the sister 背包 (inventory) page via the title text
     * itself, so we don't lean on a tiny eyebrow caption to do the work. */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .owner-bar {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: var(--color-muted-soft);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .owner-meta {
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
      min-width: 0;
    }

    .owner-name {
      color: var(--color-ink);
      font-weight: 500;
    }

    .owner-id {
      color: var(--color-muted);
      font-family: var(--font-code);
    }

    .meta-divider {
      color: var(--color-hairline);
    }

    .usage-value {
      color: var(--color-ink);
      font-weight: 600;
      font-feature-settings: "tnum";
    }

    /* ── Slot grid ─────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
    }

    .slot {
      position: relative;
      aspect-ratio: 4 / 5;
      padding: 16px 6px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: var(--radius-md);
      box-sizing: border-box;
    }

    .slot.empty {
      background-color: var(--color-canvas);
      border: 1px dashed var(--color-hairline);
    }

    .slot.occupied {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
    }

    .slot-id {
      position: absolute;
      top: 4px;
      left: 6px;
      color: var(--color-muted-soft);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      font-feature-settings: "tnum";
      letter-spacing: 0.3px;
    }

    .empty-dot {
      color: var(--color-hairline);
      font-size: 28px;
      font-weight: 200;
      line-height: 1;
    }

    .slot-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .slot-icon img {
      width: 40px;
      height: 40px;
      max-width: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .slot-stack {
      position: absolute;
      top: 4px;
      right: 4px;
      background-color: var(--color-surface-cream-strong);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      font-feature-settings: "tnum";
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      line-height: 1.4;
    }

    .slot-prefix {
      color: var(--color-accent-amber);
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .slot-name {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .slot-value {
      color: var(--color-muted);
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      font-feature-settings: "tnum";
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    /* ── Tier chips: 4-tier semantic mapping per DESIGN.md ─── */
    .tier-chip {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.4;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    /* Tier none / 0–5 → cream (neutral, lowest threshold) */
    .tier-chip.tier-none,
    .tier-chip.tier-0, .tier-chip.tier-1, .tier-chip.tier-2,
    .tier-chip.tier-3, .tier-chip.tier-4, .tier-chip.tier-5 {
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }

    /* Tier 6–10 → accent-teal (mid game) */
    .tier-chip.tier-6, .tier-chip.tier-7, .tier-chip.tier-8,
    .tier-chip.tier-9, .tier-chip.tier-10 {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    /* Tier 11–15 → accent-amber (late game) */
    .tier-chip.tier-11, .tier-chip.tier-12, .tier-chip.tier-13,
    .tier-chip.tier-14, .tier-chip.tier-15 {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    /* Tier 16–20 → primary coral solid (endgame, scarce-coral moment) */
    .tier-chip.tier-16, .tier-chip.tier-17, .tier-chip.tier-18,
    .tier-chip.tier-19, .tier-chip.tier-20 {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- Header: text hero (rule + eyebrow + serif title), owner info as byline -->
    <header>
      <div class="header-rule"></div>
      <div class="header-eyebrow type-caption-uppercase">仓库系统</div>
      <h1 class="header-title type-display-lg">用户仓库</h1>
      <div class="owner-bar">
        <img id="wh-avatar" class="avatar" alt="avatar" />
        <div class="owner-meta type-body-sm">
          <span class="owner-name" id="wh-owner-name"></span>
          <span class="owner-id" id="wh-owner-id"></span>
          <span class="meta-divider">·</span>
          <span><span class="usage-value" id="wh-used"></span> / <span class="usage-value" id="wh-capacity"></span> 已使用</span>
          <span class="meta-divider">·</span>
          <span id="wh-generated-at"></span>
        </div>
      </div>
    </header>

    <section id="wh-grid" class="grid"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="wh-data" type="application/json">__WAREHOUSE_DATA_JSON__</script>
  <script>
    (async function () {
      const data = JSON.parse(document.getElementById("wh-data").textContent);
      const slots = Array.isArray(data.slots) ? data.slots : [];

      const ownerId = String(data.owner_user_id || "");
      document.getElementById("wh-avatar").src =
        `http://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(ownerId)}&s=100`;
      document.getElementById("wh-owner-name").textContent = data.owner_user_name || "未知用户";
      document.getElementById("wh-owner-id").textContent = ownerId ? `(${ownerId})` : "";
      document.getElementById("wh-used").textContent = String(data.used || 0);
      document.getElementById("wh-capacity").textContent = String(data.capacity || 0);
      document.getElementById("wh-generated-at").textContent = data.generated_at || "";

      // Item / prefix dictionaries — fetched async, fallback to numeric ids.
      const itemNameMap = new Map();
      const prefixNameMap = new Map();
      try {
        const [itemRes, prefixRes] = await Promise.all([
          fetch("/assets/dicts/item.json"),
          fetch("/assets/dicts/prefix.json"),
        ]);
        if (itemRes.ok) {
          const list = await itemRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) itemNameMap.set(id, name);
          });
        }
        if (prefixRes.ok) {
          const list = await prefixRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) prefixNameMap.set(id, name);
          });
        }
      } catch (e) { /* dict fetch failed → fall back to numeric ids */ }

      const grid = document.getElementById("wh-grid");
      for (const slot of slots) {
        const occupied = Number(slot.item_id || 0) > 0;
        const cell = document.createElement("div");
        cell.className = "slot " + (occupied ? "occupied" : "empty");

        // Slot id (always shown, top-left)
        const id = document.createElement("div");
        id.className = "slot-id";
        id.textContent = `#${slot.slot_index}`;
        cell.appendChild(id);

        const iconWrap = document.createElement("div");
        iconWrap.className = "slot-icon";
        if (occupied) {
          const img = document.createElement("img");
          img.src = `/assets/items/Item_${slot.item_id}.png`;
          img.alt = String(slot.item_id);
          iconWrap.appendChild(img);
        } else {
          const dot = document.createElement("div");
          dot.className = "empty-dot";
          dot.textContent = "·";
          iconWrap.appendChild(dot);
        }
        cell.appendChild(iconWrap);

        if (occupied) {
          // Stack badge (only when count > 1)
          if (Number(slot.quantity || 0) > 1) {
            const stack = document.createElement("div");
            stack.className = "slot-stack";
            stack.textContent = `×${slot.quantity}`;
            cell.appendChild(stack);
          }

          const itemName = itemNameMap.get(Number(slot.item_id)) || `ID:${slot.item_id}`;
          const prefixId = Number(slot.prefix_id || 0);
          const prefixName = prefixId > 0
            ? (prefixNameMap.get(prefixId) || `前缀 ID:${prefixId}`)
            : "";

          if (prefixName) {
            const prefixLine = document.createElement("div");
            prefixLine.className = "slot-prefix";
            prefixLine.textContent = prefixName;
            cell.appendChild(prefixLine);
          }

          const nameLine = document.createElement("div");
          nameLine.className = "slot-name";
          nameLine.textContent = itemName;
          cell.appendChild(nameLine);

          if (slot.min_tier_zh) {
            const chip = document.createElement("div");
            const rank = Number(slot.min_tier_rank);
            chip.className = "tier-chip " + (rank >= 0 ? `tier-${rank}` : "tier-none");
            chip.textContent = slot.min_tier_zh;
            cell.appendChild(chip);
          }

          if (Number(slot.value || 0) > 0) {
            const valueLine = document.createElement("div");
            valueLine.className = "slot-value";
            valueLine.textContent = `金币 ${slot.value}`;
            cell.appendChild(valueLine);
          }
        }

        grid.appendChild(cell);
      }
    })();
  </script>
</body>
</html>
