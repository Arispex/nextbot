<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 菜单</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    /* ── Global reset & canvas ─────────────────────────────── */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html,
    body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-section) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Page frame ────────────────────────────────────────── */
    .page {
      max-width: 1760px;
      margin: 0 auto;
    }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      margin-bottom: var(--space-xxl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-lg);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    /* ── Empty state ───────────────────────────────────────── */
    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    .empty-state-title {
      color: var(--color-body-strong);
      margin-bottom: var(--space-xs);
    }

    /* ── Card grid ─────────────────────────────────────────── */
    .grid {
      display: grid;
      gap: var(--space-lg);
      grid-template-columns: repeat(3, 1fr);
      /* Let each card size to its own content. Without this, grid stretches
       * all cards in a row to the tallest one, which creates an empty gap
       * for alias-less cards when a row contains an aliased card. */
      align-items: start;
    }

    /* When there are only 1–2 cards, let them grow but stay aligned left.
     * minmax(360px, 480px) keeps single cards from stretching across the
     * full width on a 1920px viewport. */
    .grid[data-count="1"],
    .grid[data-count="2"] {
      grid-template-columns: repeat(auto-fit, minmax(360px, 480px));
    }

    /* ── Command card ──────────────────────────────────────── */
    .card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      /* No shadow — color-block first, depth comes from surface contrast. */
    }

    .card-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .card-desc {
      color: var(--color-body);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* ── Usage code block (dark navy embedded mockup) ──────── */
    .usage-block {
      background-color: var(--color-surface-dark);
      color: var(--color-on-dark);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .usage-block.is-empty {
      color: var(--color-on-dark-soft);
      font-style: italic;
    }

    /* ── Alias row (caption + pill chips) ──────────────────── */
    .alias-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: var(--space-xs) var(--space-sm);
    }

    .alias-label {
      color: var(--color-muted);
      flex-shrink: 0;
    }

    .alias-badge {
      background-color: var(--color-surface-soft);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-pill);
      padding: var(--space-xxs) var(--space-sm);
      overflow-wrap: break-word;
      word-break: break-all;
    }

    /* ── Permission row (caption + pill badge) ─────────────── */
    .perm-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding-top: var(--space-xs);
    }

    .perm-label {
      color: var(--color-muted);
    }

    .perm-badge {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-pill);
      padding: var(--space-xxs) var(--space-sm);
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .perm-badge.is-empty {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: transparent;
    }

    /* ── Footer ────────────────────────────────────────────── */
    .footer {
      margin-top: var(--space-xxl);
      text-align: right;
      color: var(--color-muted-soft);
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="header-rule"></div>
      <div id="header-eyebrow" class="header-eyebrow type-caption-uppercase"></div>
      <h1 id="header-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span id="header-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state-title type-title-md">暂无命令</div>
      <div class="type-body-sm">当前分类下没有可显示的命令</div>
    </div>

    <div id="card-grid" class="grid"></div>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="menu-data" type="application/json">__MENU_DATA_JSON__</script>
  <script>
    const data = (() => {
      try { return JSON.parse(document.getElementById("menu-data").textContent); }
      catch (err) { console.warn("[render] page data unavailable", err); return {}; }
    })();
    const commands = Array.isArray(data.commands) ? data.commands : [];

    document.getElementById("header-eyebrow").textContent = "命令菜单";
    document.getElementById("header-title").textContent = data.title || "菜单";
    document.getElementById("header-count").textContent = `${commands.length} 个命令`;
    document.getElementById("header-generated-at").textContent = data.generated_at || "";

    const grid = document.getElementById("card-grid");
    grid.dataset.count = String(commands.length);

    if (!commands.length) {
      document.getElementById("empty-state").hidden = false;
      grid.hidden = true;
    }

    for (const item of commands) {
      const name       = String(item?.display_name || "").trim() || "—";
      const desc       = String(item?.description  || "").trim() || "暂无介绍";
      const usage      = String(item?.usage        || "").trim();
      const permission = String(item?.permission   || "").trim();
      const aliases    = Array.isArray(item?.aliases)
        ? item.aliases.map((a) => String(a || "").trim()).filter(Boolean)
        : [];

      const card = document.createElement("article");
      card.className = "card";

      const nameEl = document.createElement("h2");
      nameEl.className = "card-name type-title-md";
      nameEl.textContent = name;

      const descEl = document.createElement("p");
      descEl.className = "card-desc type-body-md";
      descEl.textContent = desc;

      const usageEl = document.createElement("div");
      usageEl.className = "usage-block type-code" + (usage ? "" : " is-empty");
      usageEl.textContent = usage || "暂无用法";

      card.appendChild(nameEl);
      card.appendChild(descEl);
      card.appendChild(usageEl);

      if (aliases.length) {
        const aliasRow = document.createElement("div");
        aliasRow.className = "alias-row";

        const aliasLabel = document.createElement("span");
        aliasLabel.className = "alias-label type-caption-uppercase";
        aliasLabel.textContent = "别名";
        aliasRow.appendChild(aliasLabel);

        for (const alias of aliases) {
          const aliasBadge = document.createElement("span");
          aliasBadge.className = "alias-badge type-caption";
          aliasBadge.textContent = alias;
          aliasRow.appendChild(aliasBadge);
        }

        card.appendChild(aliasRow);
      }

      const permRow = document.createElement("div");
      permRow.className = "perm-row";

      const permLabel = document.createElement("span");
      permLabel.className = "perm-label type-caption-uppercase";
      permLabel.textContent = "权限";

      const permBadge = document.createElement("span");
      permBadge.className = "perm-badge type-caption" + (permission ? "" : " is-empty");
      permBadge.textContent = permission || "无需额外权限";

      permRow.appendChild(permLabel);
      permRow.appendChild(permBadge);

      card.appendChild(permRow);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
