<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 排行榜</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero) ────────────────────────────────── */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    /* ── Podium (top 3, semantic 4-tier replaces metal gradients) ─
     * #1 primary coral solid border, 2nd / 3rd outline, 1st sits center
     * and is taller — visual hierarchy via size + border weight, not
     * gradient. Order: 2nd | 1st | 3rd (classic podium). */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      align-items: end;
      gap: var(--space-md);
    }

    .podium-card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      text-align: center;
      min-width: 0;
    }

    .podium-card.rank-1 {
      border: 2px solid var(--color-primary);
      padding-top: var(--space-xl);
      padding-bottom: var(--space-xl);
    }

    .podium-card.rank-2 { border-color: var(--color-accent-amber); }
    .podium-card.rank-3 { border-color: var(--color-accent-teal); }

    .podium-rank {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 48px;
      line-height: 1;
      letter-spacing: -0.02em;
      font-feature-settings: "tnum";
      color: var(--color-muted);
    }
    .podium-card.rank-1 .podium-rank { color: var(--color-primary); font-size: 64px; }
    .podium-card.rank-2 .podium-rank { color: var(--color-accent-amber); }
    .podium-card.rank-3 .podium-rank { color: var(--color-accent-teal); }

    .podium-name {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      line-height: 1.3;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-card.rank-1 .podium-name { font-size: 18px; }

    .podium-id {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
      font-size: 11px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .podium-divider {
      width: 32px;
      height: 1px;
      background-color: var(--color-hairline);
    }

    .podium-value {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-feature-settings: "tnum";
    }

    .podium-value .v {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .podium-card.rank-1 .podium-value .v { font-size: 28px; color: var(--color-primary); }
    .podium-card.rank-2 .podium-value .v { color: var(--color-accent-amber); }
    .podium-card.rank-3 .podium-value .v { color: var(--color-accent-teal); }

    .podium-value .u {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 500;
    }

    /* ── List rows (each row is its own cream-card) ────────── */
    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .row {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-lg);
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: var(--space-md);
    }

    .rank-badge {
      color: var(--color-muted);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      font-feature-settings: "tnum";
      text-align: left;
    }

    .row-name {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .row-name-text {
      color: var(--color-ink);
      font-weight: 500;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-name-id {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
      font-size: 11px;
    }

    .row-value {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-feature-settings: "tnum";
    }

    .row-value .v {
      color: var(--color-ink);
      font-weight: 600;
      font-size: 14px;
    }

    .row-value .u {
      color: var(--color-muted-soft);
      font-size: 11px;
      font-weight: 500;
    }

    /* ── Self entry (your-rank highlight card) ─────────────── */
    .self-card {
      background-color: var(--color-surface-soft);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .self-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .self-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: var(--space-md);
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div class="header-eyebrow type-caption-uppercase">排行榜系统</div>
      <h1 id="lb-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span id="lb-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="lb-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>暂无数据</div>

    <section id="podium-section" class="podium" hidden></section>

    <section id="list" class="list"></section>

    <section id="self-card" class="self-card" hidden>
      <div class="self-label">我的排名</div>
      <div id="self-row" class="self-row"></div>
    </section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="leaderboard-data" type="application/json">__LEADERBOARD_DATA_JSON__</script>
  <script>
    (function () {
      const data = JSON.parse(document.getElementById("leaderboard-data").textContent);
      const entries = Array.isArray(data.entries) ? data.entries : [];
      const valueLabel = String(data.value_label || "");
      const formatValue = (v) => typeof v === "string" ? v : Number(v).toLocaleString();
      const page = Number(data.page || 1);
      const totalPages = Number(data.total_pages || 1);
      const selfEntry = data.self_entry || null;

      document.getElementById("lb-title").textContent = String(data.title || "排行榜").trim() || "排行榜";
      document.getElementById("lb-page").textContent = `第 ${page} / ${totalPages} 页`;
      document.getElementById("lb-generated-at").textContent = data.generated_at || "";

      if (!entries.length) {
        document.getElementById("empty-state").hidden = false;
      } else {
        renderEntries(entries, page === 1);
      }

      if (selfEntry) renderSelf(selfEntry);

      // ── helpers ──

      function renderEntries(items, isFirstPage) {
        const top3 = isFirstPage ? items.filter((e) => Number(e?.rank) <= 3) : [];
        const rest = isFirstPage ? items.filter((e) => Number(e?.rank) > 3) : items;

        if (top3.length) {
          const podium = document.getElementById("podium-section");
          podium.hidden = false;
          // Display order: 2 → 1 → 3 (classic podium center stage).
          const byRank = {};
          top3.forEach((it) => { byRank[Number(it?.rank)] = it; });
          [byRank[2], byRank[1], byRank[3]].forEach((it) => {
            if (!it) {
              // Empty slot to keep grid alignment.
              const blank = document.createElement("div");
              podium.appendChild(blank);
              return;
            }
            podium.appendChild(renderPodiumCard(it));
          });
        }

        if (rest.length) {
          const listEl = document.getElementById("list");
          rest.forEach((it) => listEl.appendChild(renderRow(it)));
        }
      }

      function renderPodiumCard(item) {
        const rank = Number(item?.rank);
        const card = document.createElement("article");
        card.className = `podium-card rank-${rank}`;

        const rankEl = document.createElement("div");
        rankEl.className = "podium-rank";
        rankEl.textContent = String(rank);
        card.appendChild(rankEl);

        const nameEl = document.createElement("div");
        nameEl.className = "podium-name";
        nameEl.textContent = String(item?.name || "").trim() || "—";
        card.appendChild(nameEl);

        const userId = String(item?.user_id || "").trim();
        if (userId) {
          const idEl = document.createElement("div");
          idEl.className = "podium-id";
          idEl.textContent = userId;
          card.appendChild(idEl);
        }

        const divider = document.createElement("div");
        divider.className = "podium-divider";
        card.appendChild(divider);

        const valueWrap = document.createElement("div");
        valueWrap.className = "podium-value";
        const v = document.createElement("span");
        v.className = "v";
        v.textContent = formatValue(item?.value ?? 0);
        valueWrap.appendChild(v);
        if (valueLabel) {
          const u = document.createElement("span");
          u.className = "u";
          u.textContent = valueLabel;
          valueWrap.appendChild(u);
        }
        card.appendChild(valueWrap);

        return card;
      }

      function renderRow(item) {
        const row = document.createElement("article");
        row.className = "row";

        const badge = document.createElement("div");
        badge.className = "rank-badge";
        badge.textContent = `#${item?.rank ?? "-"}`;
        row.appendChild(badge);

        const nameWrap = document.createElement("div");
        nameWrap.className = "row-name";
        const nameText = document.createElement("div");
        nameText.className = "row-name-text";
        nameText.textContent = String(item?.name || "").trim() || "—";
        nameWrap.appendChild(nameText);
        const userId = String(item?.user_id || "").trim();
        if (userId) {
          const idText = document.createElement("div");
          idText.className = "row-name-id";
          idText.textContent = userId;
          nameWrap.appendChild(idText);
        }
        row.appendChild(nameWrap);

        const valueWrap = document.createElement("div");
        valueWrap.className = "row-value";
        const v = document.createElement("span");
        v.className = "v";
        v.textContent = formatValue(item?.value ?? 0);
        valueWrap.appendChild(v);
        if (valueLabel) {
          const u = document.createElement("span");
          u.className = "u";
          u.textContent = valueLabel;
          valueWrap.appendChild(u);
        }
        row.appendChild(valueWrap);

        return row;
      }

      function renderSelf(item) {
        const card = document.getElementById("self-card");
        const row = document.getElementById("self-row");
        card.hidden = false;

        const badge = document.createElement("div");
        badge.className = "rank-badge";
        badge.textContent = `#${item?.rank ?? "-"}`;
        row.appendChild(badge);

        const nameWrap = document.createElement("div");
        nameWrap.className = "row-name";
        const nameText = document.createElement("div");
        nameText.className = "row-name-text";
        nameText.textContent = String(item?.name || "").trim() || "—";
        nameWrap.appendChild(nameText);
        const userId = String(item?.user_id || "").trim();
        if (userId) {
          const idText = document.createElement("div");
          idText.className = "row-name-id";
          idText.textContent = userId;
          nameWrap.appendChild(idText);
        }
        row.appendChild(nameWrap);

        const valueWrap = document.createElement("div");
        valueWrap.className = "row-value";
        const v = document.createElement("span");
        v.className = "v";
        v.textContent = formatValue(item?.value ?? 0);
        valueWrap.appendChild(v);
        if (valueLabel) {
          const u = document.createElement("span");
          u.className = "u";
          u.textContent = valueLabel;
          valueWrap.appendChild(u);
        }
        row.appendChild(valueWrap);
      }
    })();
  </script>
</body>
</html>
