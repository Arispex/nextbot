<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 管理员列表</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-md);
    }

    .admin {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      text-align: center;
      min-width: 0;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
    }

    .name {
      color: var(--color-ink);
      font-weight: 500;
      font-size: 16px;
      line-height: 1.3;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .qq {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
      font-size: 12px;
      font-feature-settings: "tnum";
    }

    .badge {
      background-color: var(--color-canvas);
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div class="header-eyebrow type-caption-uppercase">权限管理</div>
      <h1 class="header-title type-display-lg">管理员列表</h1>
      <div class="header-meta type-body-sm">
        <span id="al-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="al-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>暂无管理员</div>

    <section id="grid" class="grid"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="admin-list-data" type="application/json">__ADMIN_LIST_DATA_JSON__</script>
  <script>
    const data = JSON.parse(document.getElementById("admin-list-data").textContent);
    const admins = Array.isArray(data.admins) ? data.admins : [];

    document.getElementById("al-count").textContent = `共 ${admins.length} 名管理员`;
    document.getElementById("al-generated-at").textContent = data.generated_at || "";

    const grid = document.getElementById("grid");

    if (!admins.length) {
      document.getElementById("empty-state").hidden = false;
      grid.hidden = true;
    }

    admins.forEach((admin) => {
      const userId = String(admin?.user_id || "").trim();
      const nickname = String(admin?.nickname || "").trim() || "—";

      const card = document.createElement("article");
      card.className = "admin";

      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.alt = nickname;
      avatar.src = `http://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(userId)}&s=100`;
      card.appendChild(avatar);

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = nickname;
      card.appendChild(nameEl);

      const qqEl = document.createElement("div");
      qqEl.className = "qq";
      qqEl.textContent = userId;
      card.appendChild(qqEl);

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "Owner";
      card.appendChild(badge);

      grid.appendChild(card);
    });
  </script>
</body>
</html>
