<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 查看商店</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero — coral rule + eyebrow + serif shop name).
     * The shop name lives in the h1 because each shop_view is an editorial
     * "shop profile" page; eyebrow keeps it consistent with shop_list. */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .shop-id-value {
      color: var(--color-ink);
      font-feature-settings: "tnum";
    }

    .shop-desc {
      color: var(--color-muted);
      font-size: var(--type-body-sm-size);
      margin-top: var(--space-xs);
      max-width: 760px;
    }

    /* ── Empty state ───────────────────────────────────────── */
    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    /* ── Item rows: 2-up grid (mirrors lottery_view 9f42d9f).
     * Each card keeps its original horizontal layout (icon + mid + right);
     * laying two cards per row halves screenshot height vs the prior
     * single-column list. align-items: stretch keeps paired cards equal-
     * height when description / meta wrap differently. */
    .list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      align-items: stretch;
    }

    .item {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      align-items: stretch;
      gap: var(--space-lg);
      min-width: 0;
    }

    .item-icon {
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
    }

    .item-icon img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .item-icon.mystery {
      background-color: var(--color-canvas);
      border: 1px dashed var(--color-accent-amber);
      color: var(--color-accent-amber);
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
    }

    .item-icon.command {
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      color: var(--color-accent-teal);
      font-size: 28px;
      line-height: 1;
    }

    .item-mid {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .item-head {
      display: flex;
      /* center, not baseline — keeps small pills optically aligned with the
       * larger name baseline (matches warehouse / red_packet decision). */
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .item-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* ── Pills ─────────────────────────────────────────────── */
    .index-pill,
    .kind-pill {
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
      font-feature-settings: "tnum";
    }

    .index-pill {
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }

    .kind-pill.kind-item {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    .kind-pill.kind-command {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    .item-desc {
      color: var(--color-muted);
      font-size: var(--type-body-sm-size);
      line-height: 1.5;
    }

    .item-meta {
      color: var(--color-muted);
      font-size: var(--type-caption-size);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .item-meta-divider {
      color: var(--color-hairline);
    }

    .cmd-block {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-sm);
      font-family: var(--font-code);
      font-size: 12px;
      padding: 6px 10px;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: var(--space-xxs);
    }

    /* ── Tier chips: 4-tier semantic mapping per DESIGN.md ─── */
    .tier-chip {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .tier-chip.tier-none,
    .tier-chip.tier-0, .tier-chip.tier-1, .tier-chip.tier-2,
    .tier-chip.tier-3, .tier-chip.tier-4, .tier-chip.tier-5 {
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }

    .tier-chip.tier-6, .tier-chip.tier-7, .tier-chip.tier-8,
    .tier-chip.tier-9, .tier-chip.tier-10 {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    .tier-chip.tier-11, .tier-chip.tier-12, .tier-chip.tier-13,
    .tier-chip.tier-14, .tier-chip.tier-15 {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    .tier-chip.tier-16, .tier-chip.tier-17, .tier-chip.tier-18,
    .tier-chip.tier-19, .tier-chip.tier-20 {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    /* ── Right column: price + buy hint ────────────────────── */
    .item-right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: var(--space-xs);
      min-width: 140px;
    }

    .price {
      color: var(--color-primary);
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
      font-feature-settings: "tnum";
    }

    .price-unit {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 500;
      margin-left: 4px;
    }

    .buy-hint {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
      font-size: 11px;
      text-align: right;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 id="header-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span>ID <span class="shop-id-value" id="shop-id"></span></span>
        <span class="header-meta-divider">·</span>
        <span id="header-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-generated-at"></span>
      </div>
      <div id="shop-desc" class="shop-desc" hidden></div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>该商店暂无可购买的商品</div>

    <section id="item-list" class="list"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="shop-view-data" type="application/json">__SHOP_VIEW_DATA_JSON__</script>
  <script>
    (async function () {
      const data = (() => {
        try { return JSON.parse(document.getElementById("shop-view-data").textContent); }
        catch (err) { console.warn("[render] page data unavailable", err); return {}; }
      })();
      const items = Array.isArray(data.items) ? data.items : [];
      const total = Number(data.total || items.length || 0);
      const totalPages = Number(data.total_pages || 1);
      const page = Number(data.page || 1);

      document.getElementById("header-title").textContent = String(data.shop_name || "未命名商店").trim() || "未命名商店";
      document.getElementById("shop-id").textContent = String(data.shop_id ?? "-");
      document.getElementById("header-count").textContent = `共 ${total} 件商品`;
      document.getElementById("header-page").textContent = `第 ${page} / ${totalPages} 页`;
      document.getElementById("header-generated-at").textContent = data.generated_at || "";

      const descText = String(data.shop_description || "").trim();
      if (descText) {
        const descEl = document.getElementById("shop-desc");
        descEl.textContent = descText;
        descEl.hidden = false;
      }

      // Item / prefix dictionaries — fetched async, fallback to numeric ids.
      const itemNameMap = new Map();
      const prefixNameMap = new Map();
      try {
        const [itemRes, prefixRes] = await Promise.all([
          fetch("/assets/dicts/item.json"),
          fetch("/assets/dicts/prefix.json"),
        ]);
        if (itemRes.ok) {
          const list = await itemRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) itemNameMap.set(id, name);
          });
        }
        if (prefixRes.ok) {
          const list = await prefixRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) prefixNameMap.set(id, name);
          });
        }
      } catch (e) { /* dict fetch failed → fall back to numeric ids */ }

      const listEl = document.getElementById("item-list");

      if (!items.length) {
        document.getElementById("empty-state").hidden = false;
        listEl.hidden = true;
      }

      for (const it of items) {
        const row = document.createElement("article");
        row.className = "item";

        // ── Left: icon (item image / mystery / command gear) ──
        const iconWrap = document.createElement("div");
        iconWrap.className = "item-icon";
        if (it.kind === "item" && it.is_mystery) {
          iconWrap.classList.add("mystery");
          iconWrap.textContent = "?";
        } else if (it.kind === "item" && Number(it.item_id || 0) > 0) {
          const img = document.createElement("img");
          img.src = `/assets/items/Item_${it.item_id}.png`;
          img.alt = String(it.item_id);
          iconWrap.appendChild(img);
        } else {
          iconWrap.classList.add("command");
          iconWrap.textContent = "⚙";
        }
        row.appendChild(iconWrap);

        // ── Middle: head + desc + meta + (optional) cmd block ──
        const mid = document.createElement("div");
        mid.className = "item-mid";

        const head = document.createElement("div");
        head.className = "item-head";

        const nameEl = document.createElement("h2");
        nameEl.className = "item-name type-title-md";
        nameEl.textContent = String(it?.name || "").trim() || "未命名";
        head.appendChild(nameEl);

        const idx = document.createElement("span");
        idx.className = "index-pill";
        idx.textContent = `ID ${it.shop_item_id}`;
        head.appendChild(idx);

        const kind = document.createElement("span");
        kind.className = `kind-pill kind-${it.kind === "command" ? "command" : "item"}`;
        kind.textContent = it.kind === "item" ? "物品" : "指令";
        head.appendChild(kind);

        mid.appendChild(head);

        const itemDesc = String(it?.description || "").trim();
        if (itemDesc) {
          const desc = document.createElement("div");
          desc.className = "item-desc";
          desc.textContent = itemDesc;
          mid.appendChild(desc);
        }

        const meta = document.createElement("div");
        meta.className = "item-meta";

        if (it.kind === "item") {
          const parts = [];
          if (it.is_mystery) {
            parts.push("? ? ?");
          } else {
            const itemName = itemNameMap.get(Number(it.item_id)) || `ID:${it.item_id}`;
            const prefixId = Number(it.prefix_id || 0);
            const prefixName = prefixId > 0 ? (prefixNameMap.get(prefixId) || `前缀 ID:${prefixId}`) : "";
            parts.push(prefixName ? `${prefixName} ${itemName}` : itemName);
          }
          parts.push(`数量 ×${it.quantity}`);
          const span = document.createElement("span");
          span.textContent = parts.join("  ·  ");
          meta.appendChild(span);
          if (it.min_tier_zh) {
            const sep = document.createElement("span");
            sep.className = "item-meta-divider";
            sep.textContent = "·";
            meta.appendChild(sep);
            const chip = document.createElement("span");
            const rank = Number(it.min_tier_rank);
            chip.className = "tier-chip" + (rank >= 0 ? ` tier-${rank}` : " tier-none");
            chip.textContent = `进度：${it.min_tier_zh}`;
            meta.appendChild(chip);
          }
        } else {
          const target = document.createElement("span");
          target.textContent = `目标：${it.target_server_label || "全部服务器"}`;
          meta.appendChild(target);
        }
        mid.appendChild(meta);

        if (it.kind === "command" && it.command_template) {
          const cmd = document.createElement("div");
          cmd.className = "cmd-block";
          cmd.textContent = it.command_template;
          mid.appendChild(cmd);
        }

        row.appendChild(mid);

        // ── Right: price + buy hint ──
        const right = document.createElement("div");
        right.className = "item-right";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = String(it.price);
        const priceUnit = document.createElement("span");
        priceUnit.className = "price-unit";
        priceUnit.textContent = "金币";
        price.appendChild(priceUnit);
        right.appendChild(price);

        const buyHint = document.createElement("div");
        buyHint.className = "buy-hint";
        buyHint.textContent = `购买商品 ${data.shop_id ?? "-"} ${it.shop_item_id}`;
        right.appendChild(buyHint);

        row.appendChild(right);
        listEl.appendChild(row);
      }
    })();
  </script>
</body>
</html>
