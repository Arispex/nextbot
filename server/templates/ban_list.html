<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 封禁列表</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .entry {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .info {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-top {
      display: flex;
      align-items: baseline;
      gap: var(--space-xs);
      flex-wrap: wrap;
    }

    .name {
      color: var(--color-ink);
      font-weight: 500;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .qq {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
      font-size: 11px;
    }

    .reason {
      color: var(--color-primary);
      font-size: 13px;
      font-weight: 500;
    }

    .reason-label {
      color: var(--color-muted);
      font-weight: 400;
      margin-right: 4px;
    }

    .time {
      color: var(--color-muted-soft);
      font-size: 11px;
      font-feature-settings: "tnum";
      flex-shrink: 0;
    }

    .index {
      color: var(--color-muted-soft);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      font-feature-settings: "tnum";
      flex-shrink: 0;
      min-width: 32px;
      text-align: right;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 class="header-title type-display-lg">封禁列表</h1>
      <div class="header-meta type-body-sm">
        <span id="bl-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="bl-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="bl-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>暂无封禁用户</div>

    <section id="list" class="list"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="ban-list-data" type="application/json">__BAN_LIST_DATA_JSON__</script>
  <script>
    const data = (() => {
      try { return JSON.parse(document.getElementById("ban-list-data").textContent); }
      catch (err) { console.warn("[render] page data unavailable", err); return {}; }
    })();
    const entries = Array.isArray(data.entries) ? data.entries : [];
    const page = Number(data.page || 1);
    const totalPages = Number(data.total_pages || 1);

    document.getElementById("bl-count").textContent = `共 ${entries.length} 个封禁用户`;
    document.getElementById("bl-page").textContent = `第 ${page} / ${totalPages} 页`;
    document.getElementById("bl-generated-at").textContent = data.generated_at || "";

    const listEl = document.getElementById("list");

    if (!entries.length) {
      document.getElementById("empty-state").hidden = false;
      listEl.hidden = true;
    }

    entries.forEach((entry, i) => {
      const name = String(entry?.name || "").trim() || "—";
      const userId = String(entry?.user_id || "").trim();
      const reason = String(entry?.ban_reason || "").trim() || "未说明";
      const bannedAt = String(entry?.banned_at || "").trim();
      const index = entry?.index ?? (i + 1);

      const row = document.createElement("article");
      row.className = "entry";

      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.alt = "";
      avatar.src = `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(userId)}&s=100`;
      row.appendChild(avatar);

      const info = document.createElement("div");
      info.className = "info";

      const top = document.createElement("div");
      top.className = "info-top";
      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = name;
      top.appendChild(nameEl);
      if (userId) {
        const qqEl = document.createElement("span");
        qqEl.className = "qq";
        qqEl.textContent = `(${userId})`;
        top.appendChild(qqEl);
      }
      info.appendChild(top);

      const reasonRow = document.createElement("div");
      reasonRow.className = "reason";
      const reasonLabel = document.createElement("span");
      reasonLabel.className = "reason-label";
      reasonLabel.textContent = "封禁原因";
      reasonRow.appendChild(reasonLabel);
      reasonRow.appendChild(document.createTextNode(reason));
      info.appendChild(reasonRow);

      if (bannedAt) {
        const timeEl = document.createElement("div");
        timeEl.className = "time";
        timeEl.textContent = bannedAt;
        info.appendChild(timeEl);
      }

      row.appendChild(info);

      const indexEl = document.createElement("div");
      indexEl.className = "index";
      indexEl.textContent = `#${index}`;
      row.appendChild(indexEl);

      listEl.appendChild(row);
    });
  </script>
</body>
</html>
