<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 抽奖结果</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero — coral rule + eyebrow + serif "抽奖结果").
     * The pool / user pills sit on the byline row so the page reads as
     * "you opened pack X" rather than burying meta in a separate card. */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .owner-bar {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: var(--color-muted-soft);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .owner-meta {
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
      min-width: 0;
    }

    .owner-name {
      color: var(--color-ink);
      font-weight: 500;
    }

    .owner-id {
      color: var(--color-muted);
      font-family: var(--font-code);
    }

    .meta-divider {
      color: var(--color-hairline);
    }

    .meta-value {
      color: var(--color-ink);
      font-feature-settings: "tnum";
    }

    /* ── Stats tiles (5 across, cream-card not bg-with-accent-bar) ─ */
    .stats-tiles {
      display: grid;
      gap: var(--space-sm);
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .stat-tile {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stat-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-feature-settings: "tnum";
      /* R4R-polish：MAX_COINS bump 到 100 亿后单格数字最长可达 14 字符（含千分位），
       * 原 ellipsis 截断会丢精度；改 break-all + break-word 让长数字换行展示。 */
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .stat-value.gain { color: var(--color-accent-teal); }
    .stat-value.loss { color: var(--color-primary); }

    /* ── Gacha grid (this page IS a gacha page — cards are the
     * design language; we only strip the multi-color tier backgrounds
     * and lean on the 4-tier semantic palette instead). ───────── */
    .gacha-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: var(--space-sm);
    }

    .gacha-grid.single-card {
      grid-template-columns: minmax(220px, 280px);
      justify-content: center;
    }

    .gacha-card {
      position: relative;
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: 14px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-height: 200px;
    }

    /* 4-tier semantic mapping: tier 0 = miss (cream + dashed),
     * tier 1-2 = neutral (cream solid), tier 3 = teal, tier 4 = amber,
     * tier 5 = primary coral. */
    .gacha-card.tier-0 {
      background-color: var(--color-surface-soft);
      border: 1px dashed var(--color-hairline);
    }
    .gacha-card.tier-3 { border-color: var(--color-accent-teal); }
    .gacha-card.tier-4 { border-color: var(--color-accent-amber); }
    .gacha-card.tier-5 {
      border: 2px solid var(--color-primary);
      background-color: var(--color-canvas);
    }

    .gacha-stars {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--color-hairline);
      font-weight: 600;
      font-feature-settings: "tnum";
    }
    .gacha-card.tier-1 .gacha-stars .filled,
    .gacha-card.tier-2 .gacha-stars .filled { color: var(--color-muted); }
    .gacha-card.tier-3 .gacha-stars .filled { color: var(--color-accent-teal); }
    .gacha-card.tier-4 .gacha-stars .filled { color: var(--color-accent-amber); }
    .gacha-card.tier-5 .gacha-stars .filled { color: var(--color-primary); }

    .gacha-stars-miss {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .gacha-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      color: var(--color-muted);
    }
    .gacha-card.tier-3 .gacha-icon-wrap { color: var(--color-accent-teal); border-color: var(--color-accent-teal); }
    .gacha-card.tier-4 .gacha-icon-wrap { color: var(--color-accent-amber); border-color: var(--color-accent-amber); }
    .gacha-card.tier-5 .gacha-icon-wrap { color: var(--color-primary); border-color: var(--color-primary); }
    .gacha-card.tier-0 .gacha-icon-wrap {
      border: 1px dashed var(--color-hairline);
      color: var(--color-muted);
    }
    .gacha-card.coin-pos .gacha-icon-wrap { color: var(--color-accent-teal); border-color: var(--color-accent-teal); }
    .gacha-card.coin-neg .gacha-icon-wrap { color: var(--color-primary); border-color: var(--color-primary); }

    .gacha-icon-wrap img { width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated; }
    .gacha-icon-emoji { font-size: 30px; line-height: 1; font-family: var(--font-display); font-weight: 600; }

    .gacha-name {
      color: var(--color-ink);
      font-size: 12px;
      font-weight: 600;
      max-width: 100%;
      text-align: center;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-feature-settings: "tnum";
    }
    .gacha-card.tier-0 .gacha-name { color: var(--color-muted); font-weight: 500; }

    .gacha-bottom {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: auto;
    }

    .gacha-kind-chip {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border: 1px solid var(--color-hairline);
      font-feature-settings: "tnum";
    }
    .gacha-card.tier-3 .gacha-kind-chip { color: var(--color-accent-teal); border-color: var(--color-accent-teal); }
    .gacha-card.tier-4 .gacha-kind-chip { color: var(--color-accent-amber); border-color: var(--color-accent-amber); }
    .gacha-card.tier-5 .gacha-kind-chip { background-color: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
    /* coin-pos/neg must reset background — otherwise tier-5+coin-pos
     * gives coral bg with teal text (zero contrast). The semantic
     * "coin direction" colour wins over rarity tier on the chip. */
    .gacha-card.coin-pos .gacha-kind-chip {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }
    .gacha-card.coin-neg .gacha-kind-chip {
      background-color: var(--color-canvas);
      color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .gacha-count-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 26px;
      height: 20px;
      padding: 0 7px;
      border-radius: var(--radius-pill);
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      font-size: 10px;
      font-weight: 600;
      font-feature-settings: "tnum";
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Command results card ──────────────────────────────── */
    .cmd-card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
    }

    .cmd-card-title {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .cmd-line {
      font-family: var(--font-code);
      font-size: 12px;
      line-height: 1.6;
    }

    .cmd-line.ok { color: var(--color-accent-teal); }
    .cmd-line.fail { color: var(--color-primary); }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 class="header-title type-display-lg">抽奖</h1>
      <div class="owner-bar">
        <img id="lr-avatar" class="avatar" alt="avatar" />
        <div class="owner-meta type-body-sm">
          <span class="owner-name" id="lr-owner-name"></span>
          <span class="owner-id" id="lr-owner-id"></span>
          <span class="meta-divider">·</span>
          <span>奖池 <span class="meta-value" id="meta-pool-name"></span> (<span class="meta-value" id="meta-pool-id"></span>)</span>
          <span class="meta-divider">·</span>
          <span id="generated-at"></span>
        </div>
      </div>
    </header>

    <section class="stats-tiles">
      <div class="stat-tile">
        <span class="stat-label">抽奖次数</span>
        <span class="stat-value" id="sum-draw-count"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">花费</span>
        <span class="stat-value loss" id="sum-cost"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">奖品估值</span>
        <span class="stat-value" id="sum-coin-delta"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">入库</span>
        <span class="stat-value" id="sum-slots"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">当前金币</span>
        <span class="stat-value" id="sum-coins-after"></span>
      </div>
    </section>

    <section id="gacha-grid" class="gacha-grid"></section>

    <div id="cmd-card" class="cmd-card" hidden>
      <div class="cmd-card-title">指令执行明细</div>
      <div id="cmd-list"></div>
    </div>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="lottery-result-data" type="application/json">__LOTTERY_RESULT_DATA_JSON__</script>
  <script>
    (function () {
      const data = (() => {
        try { return JSON.parse(document.getElementById("lottery-result-data").textContent); }
        catch (err) { console.warn("[render] page data unavailable", err); return {}; }
      })();
      const outcomes = Array.isArray(data.outcomes) ? data.outcomes : [];

      // ── Header meta ─────────────────────────────────────────
      const playerName = String(data.user_user_name || "").trim();
      const playerQq = String(data.user_user_id || "").trim();
      document.getElementById("lr-avatar").src =
        `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(playerQq)}&s=100`;
      document.getElementById("lr-owner-name").textContent = playerName || "未知玩家";
      document.getElementById("lr-owner-id").textContent = playerQq ? `(${playerQq})` : "";
      document.getElementById("meta-pool-name").textContent = String(data.pool_name || "未命名");
      document.getElementById("meta-pool-id").textContent = `#${data.pool_id ?? "-"}`;
      document.getElementById("generated-at").textContent = data.generated_at || "";

      // ── Stats tiles ─────────────────────────────────────────
      document.getElementById("sum-draw-count").textContent = `${data.draw_count || 1} 次`;
      document.getElementById("sum-cost").textContent = `− ${data.total_cost || 0}`;
      const delta = Number(data.coin_delta || 0) + Number(data.item_value_gained || 0);
      const deltaEl = document.getElementById("sum-coin-delta");
      deltaEl.textContent = `${delta >= 0 ? "+ " : "− "}${Math.abs(delta)}`;
      deltaEl.classList.remove("gain", "loss");
      if (delta > 0) deltaEl.classList.add("gain");
      else if (delta < 0) deltaEl.classList.add("loss");
      document.getElementById("sum-slots").textContent = `${data.item_slots_used || 0} 格`;
      document.getElementById("sum-coins-after").textContent = String(data.user_coins_after || 0);

      // ── Outcomes ───────────────────────────────────────────
      const grid = document.getElementById("gacha-grid");
      if (outcomes.length === 1) grid.classList.add("single-card");
      outcomes.forEach((o) => grid.appendChild(renderCard(o)));

      // ── Command results ────────────────────────────────────
      const cmds = Array.isArray(data.command_results) ? data.command_results : [];
      if (cmds.length > 0) {
        const card = document.getElementById("cmd-card");
        const lst = document.getElementById("cmd-list");
        cmds.forEach((r) => {
          const line = document.createElement("div");
          line.className = "cmd-line " + (r.ok ? "ok" : "fail");
          const mark = r.ok ? "✓" : "✗";
          const reason = !r.ok && r.reason ? `（${r.reason}）` : (r.ok ? "" : "（失败）");
          line.textContent = `${mark} ${r.server_label || ""}${reason}`;
          lst.appendChild(line);
        });
        card.hidden = false;
      }

      // ── Helpers ────────────────────────────────────────────

      function appendStars(node, tier) {
        for (let i = 0; i < 5; i++) {
          const span = document.createElement("span");
          if (i < tier) span.className = "filled";
          span.textContent = "★";
          node.appendChild(span);
        }
      }

      function buildIcon(o, size) {
        if (o.kind === "item" && !o.is_mystery && Number(o.item_id || 0) > 0) {
          const img = document.createElement("img");
          img.src = `/assets/items/Item_${o.item_id}.png`;
          img.alt = String(o.item_id);
          img.style.width = `${size}px`;
          img.style.height = `${size}px`;
          return img;
        }
        const span = document.createElement("span");
        span.className = "gacha-icon-emoji";
        span.style.fontSize = `${Math.round(size * 0.72)}px`;
        if (o.kind === "miss") span.textContent = "—";
        else if (o.kind === "command") span.textContent = "⚙";
        else if (o.kind === "coin") {
          const positive = Number(o.coin_amount || 0) >= 0;
          span.textContent = positive ? "+" : "−";
        } else if (o.kind === "item" && o.is_mystery) span.textContent = "?";
        else span.textContent = "•";
        return span;
      }

      function renderCard(o) {
        const card = document.createElement("article");
        const tier = Number(o.rarity_tier || 0);
        card.className = `gacha-card tier-${tier}`;
        if (o.kind === "coin") {
          card.classList.add(Number(o.coin_amount || 0) >= 0 ? "coin-pos" : "coin-neg");
        }

        if ((o.count || 1) > 1) {
          const badge = document.createElement("div");
          badge.className = "gacha-count-badge";
          badge.textContent = `× ${o.count}`;
          card.appendChild(badge);
        }

        if (tier === 0) {
          const m = document.createElement("div");
          m.className = "gacha-stars-miss";
          m.textContent = "未中奖";
          card.appendChild(m);
        } else {
          const stars = document.createElement("div");
          stars.className = "gacha-stars";
          appendStars(stars, tier);
          card.appendChild(stars);
        }

        const iconWrap = document.createElement("div");
        iconWrap.className = "gacha-icon-wrap";
        iconWrap.appendChild(buildIcon(o, 44));
        card.appendChild(iconWrap);

        const name = document.createElement("div");
        name.className = "gacha-name";
        if (o.kind === "miss") {
          name.textContent = "谢谢参与";
        } else if (o.kind === "item" && o.is_mystery) {
          name.textContent = o.name || "未知物品";
        } else if (o.kind === "coin") {
          const total = Number(o.total_coin || 0);
          name.textContent = `${o.name || "金币"}  ${total >= 0 ? "+" : ""}${total}`;
        } else {
          name.textContent = o.name || "未命名";
        }
        card.appendChild(name);

        const bottom = document.createElement("div");
        bottom.className = "gacha-bottom";
        const chip = document.createElement("span");
        chip.className = "gacha-kind-chip";
        if (o.kind === "item") chip.textContent = `物品 ×${o.total_quantity || o.quantity || 1}`;
        else if (o.kind === "command") chip.textContent = "指令";
        else if (o.kind === "coin") chip.textContent = Number(o.coin_amount || 0) >= 0 ? "金币奖励" : "金币扣除";
        else chip.textContent = "未中奖";
        bottom.appendChild(chip);
        card.appendChild(bottom);

        return card;
      }
    })();
  </script>
</body>
</html>
