<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 抢劫结果</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero — coral rule + eyebrow + serif title). */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .owner-bar {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: var(--color-muted-soft);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .owner-meta {
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
      min-width: 0;
    }

    .owner-name {
      color: var(--color-ink);
      font-weight: 500;
    }

    .owner-id {
      color: var(--color-muted);
      font-family: var(--font-code);
    }

    .meta-divider {
      color: var(--color-hairline);
    }

    .meta-value {
      color: var(--color-ink);
      font-feature-settings: "tnum";
    }

    /* ── Stats tiles (4 across, cream-card). ─ */
    .stats-tiles {
      display: grid;
      gap: var(--space-sm);
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .stat-tile {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stat-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-feature-settings: "tnum";
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .stat-value.gain { color: var(--color-accent-teal); }
    .stat-value.loss { color: var(--color-primary); }

    /* ── Rob display (sits directly on canvas, no card wrap). ── */
    .rob-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
    }

    .rob-row {
      display: flex;
      gap: var(--space-md);
      align-items: center;
      justify-content: center;
    }

    .player-card {
      width: 180px;
      min-height: 140px;
      background-color: var(--color-surface-cream-strong);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-xxs);
      padding: var(--space-md);
      position: relative;
    }

    .player-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--color-surface-cream-strong);
      margin-bottom: var(--space-sm);
    }

    .player-card.is-source {
      opacity: 0.7;
    }
    .player-card.is-source::after {
      content: "";
      position: absolute;
      top: -6px;
      right: -6px;
      width: 12px;
      height: 12px;
      background: var(--color-accent-amber);
      border-radius: 50%;
    }

    .player-card.is-target {
      background-color: var(--color-surface-cream-strong);
      outline: 2px solid var(--color-primary);
    }

    .player-card-role {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
    }

    .player-card-name {
      color: var(--color-ink);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.3px;
      line-height: 1.2;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .player-card-qq {
      color: var(--color-muted);
      font-family: var(--font-code);
      font-size: 13px;
      font-feature-settings: "tnum";
      margin-top: 2px;
    }

    /* ── Flow indicator between the two cards (icon + amount + label). ── */
    .rob-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      min-width: 120px;
    }

    .rob-flow-icon {
      font-size: 48px;
      font-family: var(--font-display);
      line-height: 1;
    }

    .rob-flow-amount {
      font-family: var(--font-code);
      font-size: 24px;
      color: var(--color-ink);
      font-weight: 600;
      font-feature-settings: "tnum";
    }

    .rob-flow-label {
      color: var(--color-muted);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* 5 状态切色 */
    .rob-flow.rob-flow-crit .rob-flow-icon { color: var(--color-primary); }
    .rob-flow.rob-flow-crit .rob-flow-amount { color: var(--color-primary); }
    .rob-flow.rob-flow-success .rob-flow-icon { color: var(--color-primary); }
    .rob-flow.rob-flow-success .rob-flow-amount { color: var(--color-primary); }
    .rob-flow.rob-flow-counter .rob-flow-icon { color: var(--color-accent-amber); }
    .rob-flow.rob-flow-counter .rob-flow-amount { color: var(--color-accent-amber); }
    .rob-flow.rob-flow-police .rob-flow-icon { color: var(--color-body-strong); }
    .rob-flow.rob-flow-fail .rob-flow-icon { color: var(--color-muted); }

    /* ── Rob result (text label below the cards, single line). ─── */
    .rob-result {
      font-family: var(--font-display);
      font-size: var(--type-display-sm-size, 28px);
      font-weight: 400;
      letter-spacing: -0.3px;
      line-height: 1.2;
      text-align: center;
      color: var(--color-muted);
      margin: 0;
    }

    .rob-result.rob-result-crit { color: var(--color-primary); }
    .rob-result.rob-result-crit .rob-result-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      background-color: var(--color-accent-amber);
      margin-right: var(--space-xs);
      vertical-align: middle;
    }
    .rob-result.rob-result-success { color: var(--color-primary); }
    .rob-result.rob-result-counter { color: var(--color-body-strong); }
    .rob-result.rob-result-police { color: var(--color-body-strong); }
    .rob-result.rob-result-fail { color: var(--color-muted); }

    /* ── Cap warning ───────────────────────────────────────────── */
    .cap-warning {
      color: var(--color-warning, var(--color-accent-amber));
      text-align: center;
    }

    /* ── Footer ────────────────────────────────────────────────── */
    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }

    /* Fallback state when JSON payload fails to parse. */
    body.fallback .page {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 class="header-title type-display-lg">抢劫</h1>
      <div class="owner-bar">
        <img id="rob-avatar" class="avatar" alt="avatar" />
        <div class="owner-meta type-body-sm">
          <span class="owner-name" id="rob-owner-name"></span>
          <span class="owner-id" id="rob-owner-id"></span>
          <span class="meta-divider">·</span>
          <span id="generated-at"></span>
        </div>
      </div>
    </header>

    <section class="stats-tiles">
      <div class="stat-tile">
        <span class="stat-label">理论金额</span>
        <span class="stat-value" id="sum-amount"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">实际转移</span>
        <span class="stat-value" id="sum-applied"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">抢劫者金币变化</span>
        <span class="stat-value" id="sum-delta"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">当前金币</span>
        <span class="stat-value" id="sum-coins"></span>
      </div>
    </section>

    <section class="rob-display">
      <div class="rob-row">
        <div class="player-card" id="rob-robber-card">
          <img class="player-avatar" id="rob-robber-avatar" src="" alt="" referrerpolicy="no-referrer" />
          <span class="player-card-role">抢劫者</span>
          <span class="player-card-name" id="card-robber-name"></span>
          <span class="player-card-qq" id="card-robber-qq"></span>
        </div>
        <div class="rob-flow" id="rob-flow">
          <div class="rob-flow-icon" id="rob-flow-icon"></div>
          <div class="rob-flow-amount" id="rob-flow-amount"></div>
          <div class="rob-flow-label type-caption-uppercase" id="rob-flow-label"></div>
        </div>
        <div class="player-card" id="rob-victim-card">
          <img class="player-avatar" id="rob-victim-avatar" src="" alt="" referrerpolicy="no-referrer" />
          <span class="player-card-role">目标</span>
          <span class="player-card-name" id="card-victim-name"></span>
          <span class="player-card-qq" id="card-victim-qq"></span>
        </div>
      </div>
      <div class="rob-result" id="rob-result"></div>
    </section>

    <div id="cap-warning" class="cap-warning type-caption" hidden></div>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="rob-data" type="application/json">__ROB_DATA_JSON__</script>
  <script>
    (function () {
      let data;
      try {
        data = JSON.parse(document.getElementById("rob-data").textContent);
      } catch (err) {
        console.warn("[rob] page data unavailable", err);
        document.body.classList.add("fallback");
        return;
      }

      const robberName = String(data.robber_name || "").trim() || "—";
      const robberQq = String(data.robber_qq || "").trim() || "—";
      const victimName = String(data.victim_name || "").trim() || "—";
      const victimQq = String(data.victim_qq || "").trim() || "—";
      const resultKind = String(data.result_kind || "fail");
      const resultLabelRaw = String(data.result_label || "").trim();
      const amount = Number(data.amount || 0);
      const appliedAmount = Number(data.applied_amount || 0);
      const capped = Boolean(data.capped);
      const capSubject = String(data.cap_subject || "none");
      const robberFinalCoins = Number(data.robber_final_coins || 0);
      const generatedAt = String(data.generated_at || "");

      // ── Header meta ────────────────────────────────────────
      document.getElementById("rob-avatar").src =
        `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(robberQq)}&s=100`;
      document.getElementById("rob-owner-name").textContent = robberName || "未知玩家";
      document.getElementById("rob-owner-id").textContent = robberQq ? `(${robberQq})` : "";
      document.getElementById("generated-at").textContent = generatedAt;

      // ── Stats tiles ────────────────────────────────────────
      document.getElementById("sum-amount").textContent = String(amount);
      document.getElementById("sum-applied").textContent = String(appliedAmount);

      // 抢劫者金币变化：crit/success 为正（applied_amount），其它为负（amount）
      const deltaEl = document.getElementById("sum-delta");
      deltaEl.classList.remove("gain", "loss");
      let robberDelta = 0;
      if (resultKind === "crit" || resultKind === "success") {
        robberDelta = appliedAmount;
      } else if (resultKind === "counter") {
        robberDelta = -amount;
      } else if (resultKind === "police" || resultKind === "fail") {
        robberDelta = -amount;
      }
      if (robberDelta > 0) {
        deltaEl.textContent = `+ ${robberDelta}`;
        deltaEl.classList.add("gain");
      } else if (robberDelta < 0) {
        deltaEl.textContent = `− ${Math.abs(robberDelta)}`;
        deltaEl.classList.add("loss");
      } else {
        deltaEl.textContent = "0";
      }

      document.getElementById("sum-coins").textContent = String(robberFinalCoins);

      // ── Player cards ───────────────────────────────────────
      document.getElementById("card-robber-name").textContent = robberName;
      document.getElementById("card-robber-qq").textContent = robberQq;
      document.getElementById("card-victim-name").textContent = victimName;
      document.getElementById("card-victim-qq").textContent = victimQq;

      // ── QQ Avatars ─────────────────────────────────────────
      const avatarUrl = (qq) => `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=100`;
      const robberAvatarEl = document.getElementById("rob-robber-avatar");
      const victimAvatarEl = document.getElementById("rob-victim-avatar");
      robberAvatarEl.src = avatarUrl(robberQq);
      victimAvatarEl.src = avatarUrl(victimQq);
      const handleAvatarError = (el) => { el.style.visibility = "hidden"; };
      robberAvatarEl.addEventListener("error", function () { handleAvatarError(this); });
      victimAvatarEl.addEventListener("error", function () { handleAvatarError(this); });

      // ── Central flow indicator + source/target highlight ───
      const FLOW_PRESETS = {
        crit:    { icon: "🔥 ←", label: "抢走",         cls: "rob-flow-crit",    source: "victim", target: "robber" },
        success: { icon: "←",    label: "抢走",         cls: "rob-flow-success", source: "victim", target: "robber" },
        counter: { icon: "→",    label: "反被抢",       cls: "rob-flow-counter", source: "robber", target: "victim" },
        police:  { icon: "🚨 ↓", label: "罚款凭空消失", cls: "rob-flow-police",  source: null,     target: null },
        fail:    { icon: "❌",   label: "凭空消失",     cls: "rob-flow-fail",    source: null,     target: null },
      };
      const flowPreset = FLOW_PRESETS[resultKind] || FLOW_PRESETS.fail;
      const flowEl = document.getElementById("rob-flow");
      flowEl.className = "rob-flow " + flowPreset.cls;
      document.getElementById("rob-flow-icon").textContent = flowPreset.icon;
      // 入账金额优先取 applied_amount（实际转移 / 实际损失），fail / police 等场景下 fallback 到 amount。
      const flowAmount = appliedAmount || amount || 0;
      document.getElementById("rob-flow-amount").textContent = `💰 ${flowAmount}`;
      document.getElementById("rob-flow-label").textContent = flowPreset.label;

      const robberCardEl = document.getElementById("rob-robber-card");
      const victimCardEl = document.getElementById("rob-victim-card");
      robberCardEl.classList.toggle("is-source", flowPreset.source === "robber");
      robberCardEl.classList.toggle("is-target", flowPreset.target === "robber");
      victimCardEl.classList.toggle("is-source", flowPreset.source === "victim");
      victimCardEl.classList.toggle("is-target", flowPreset.target === "victim");

      // ── Rob result ─────────────────────────────────────────
      const resultEl = document.getElementById("rob-result");
      const RESULT_PRESETS = {
        crit: { cls: "rob-result-crit", text: "🔥 大成功", dot: true },
        success: { cls: "rob-result-success", text: "✅ 抢劫成功" },
        counter: { cls: "rob-result-counter", text: "🚫 反被抢" },
        police: { cls: "rob-result-police", text: "🚨 地牢守卫介入" },
        fail: { cls: "rob-result-fail", text: "❌ 失败" },
      };
      const preset = RESULT_PRESETS[resultKind] || RESULT_PRESETS.fail;
      resultEl.classList.add(preset.cls);
      if (preset.dot) {
        const dot = document.createElement("span");
        dot.className = "rob-result-dot";
        resultEl.appendChild(dot);
      }
      const textSpan = document.createElement("span");
      // 优先使用服务端传过来的 result_label（带本地化文案），否则 fallback preset.text。
      textSpan.textContent = resultLabelRaw
        ? `${preset.text.split(" ")[0]} ${resultLabelRaw}`
        : preset.text;
      resultEl.appendChild(textSpan);

      // ── Cap warning ────────────────────────────────────────
      if (capped && appliedAmount < amount) {
        const capEl = document.getElementById("cap-warning");
        const missing = amount - appliedAmount;
        if (capSubject === "robber") {
          capEl.textContent = `⚠️ 你已触账户上限，理论抢走 ${amount}，${missing} 金币未入账`;
          capEl.hidden = false;
        } else if (capSubject === "victim") {
          capEl.textContent = `⚠️ 对方账户已触上限，理论 ${amount} 金币，${missing} 金币未入账`;
          capEl.hidden = false;
        }
      }
    })();
  </script>
</body>
</html>
