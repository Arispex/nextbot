<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 世界进度</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero) ────────────────────────────────── */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .meta-value {
      color: var(--color-ink);
      font-feature-settings: "tnum";
    }

    /* ── Defeated count + progress bar ─────────────────────── */
    .summary {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-xl);
      display: flex;
      align-items: center;
      gap: var(--space-xl);
    }

    .summary-count {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-feature-settings: "tnum";
    }

    .summary-defeated {
      color: var(--color-primary);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 36px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .summary-slash {
      color: var(--color-hairline);
      font-size: 24px;
      font-weight: 500;
    }

    .summary-total {
      color: var(--color-muted);
      font-size: 24px;
      font-weight: 500;
    }

    .summary-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-left: var(--space-xs);
      align-self: center;
    }

    .summary-bar {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: var(--space-md);
      min-width: 0;
    }

    .progress-track {
      flex: 1 1 auto;
      height: 6px;
      background-color: var(--color-hairline);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
    }

    .progress-pct {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      font-feature-settings: "tnum";
      white-space: nowrap;
    }

    /* ── Boss grid ─────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-md);
    }

    .boss {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      min-height: 180px;
    }

    .boss.defeated {
      border: 2px solid var(--color-primary);
    }

    .boss.undefeated {
      background-color: var(--color-surface-soft);
      border: 1px dashed var(--color-hairline);
    }

    .boss-img {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 80px;
    }

    .boss-img img {
      max-height: 80px;
      max-width: 140px;
      object-fit: contain;
    }

    .boss.undefeated .boss-img img {
      filter: grayscale(80%) opacity(0.55);
    }

    .boss-img .placeholder {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas);
      border: 1px dashed var(--color-hairline);
      color: var(--color-muted);
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
    }

    .boss.defeated .boss-img .placeholder {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .boss-name {
      color: var(--color-ink);
      font-weight: 500;
      font-size: 14px;
      text-align: center;
      line-height: 1.3;
    }

    .boss.undefeated .boss-name {
      color: var(--color-muted);
      font-weight: 400;
    }

    .boss-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px var(--space-xs);
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      letter-spacing: 0.02em;
    }

    .boss.defeated .boss-badge {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    .boss.undefeated .boss-badge {
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 class="header-title type-display-lg">世界进度</h1>
      <div class="header-meta type-body-sm">
        <span>服务器 <span class="meta-value" id="meta-server-name"></span></span>
        <span class="header-meta-divider" id="server-id-divider" hidden>·</span>
        <span id="server-id-wrap" hidden>ID <span class="meta-value" id="meta-server-id"></span></span>
        <span class="header-meta-divider">·</span>
        <span id="meta-time"></span>
      </div>
    </header>

    <section class="summary">
      <div class="summary-count">
        <span class="summary-defeated" id="summary-defeated">0</span>
        <span class="summary-slash">/</span>
        <span class="summary-total" id="summary-total">0</span>
        <span class="summary-label">已击败</span>
      </div>
      <div class="summary-bar">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
    </section>

    <section id="grid" class="grid"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="progress-data" type="application/json">__PROGRESS_DATA_JSON__</script>
  <script>
    const BOSS_IMG_MAP = {
      "史莱姆王":              { key: "kingSlime",                       ext: "gif"  },
      "克苏鲁之眼":            { key: "eyeOfCthulhu",                    ext: "gif"  },
      "世界吞噬者/克苏鲁之脑": { key: "eaterOfWorldsOrBrainOfCthulhu",   ext: "webp" },
      "蜂后":                  { key: "queenBee",                        ext: "gif"  },
      "骷髅王":                { key: "skeletron",                       ext: "webp" },
      "独眼鹿怪":              { key: "deerclops",                       ext: "png"  },
      "血肉墙":                { key: "wallOfFlesh",                     ext: "gif"  },
      "史莱姆王后":            { key: "queenSlime",                      ext: "webp" },
      "双子魔眼":              { key: "theTwins",                        ext: "gif"  },
      "毁灭者":                { key: "theDestroyer",                    ext: "webp" },
      "机械骷髅王":            { key: "skeletronPrime",                  ext: "gif"  },
      "世纪之花":              { key: "plantera",                        ext: "gif"  },
      "石巨人":                { key: "golem",                           ext: "webp" },
      "猪龙鱼公爵":            { key: "dukeFishron",                     ext: "gif"  },
      "光之女皇":              { key: "empressOfLight",                  ext: "gif"  },
      "邪教徒":                { key: "lunaticCultist",                  ext: "gif"  },
      "日耀柱":                { key: "solarPillar",                     ext: "webp" },
      "星云柱":                { key: "nebulaPillar",                    ext: "webp" },
      "漩涡柱":                { key: "vortexPillar",                    ext: "webp" },
      "星尘柱":                { key: "stardustPillar",                  ext: "webp" },
      "月亮领主":              { key: "moonLord",                        ext: "gif"  },
    };

    const data = (() => {
      try { return JSON.parse(document.getElementById("progress-data").textContent); }
      catch (err) { console.warn("[render] page data unavailable", err); return {}; }
    })();
    const progress = Array.isArray(data.progress) ? data.progress : [];

    document.getElementById("meta-server-name").textContent = String(data.server_name || "未知服务器");
    if (data.server_id) {
      document.getElementById("server-id-divider").hidden = false;
      document.getElementById("server-id-wrap").hidden = false;
      // Defensive: server_id is expected numeric; normalize via Number to
      // avoid arbitrary-string display if payload shape ever drifts.
      const sid = Number(data.server_id);
      document.getElementById("meta-server-id").textContent = Number.isFinite(sid)
        ? String(sid)
        : "";
    }
    document.getElementById("meta-time").textContent = data.generated_at || "";

    const total = Number(data.total_count || 0);
    const defeated = Number(data.defeated_count || 0);
    const pct = total > 0 ? Math.round(defeated / total * 100) : 0;
    document.getElementById("summary-defeated").textContent = String(defeated);
    document.getElementById("summary-total").textContent = String(total);
    document.getElementById("progress-fill").style.width = `${pct}%`;
    document.getElementById("progress-pct").textContent = `${pct}%`;

    const grid = document.getElementById("grid");
    progress.forEach((item) => {
      const isDefeated = Boolean(item?.defeated);
      const name = String(item?.name || "未知");
      const imgInfo = BOSS_IMG_MAP[name];

      const card = document.createElement("article");
      card.className = "boss " + (isDefeated ? "defeated" : "undefeated");

      const imgWrap = document.createElement("div");
      imgWrap.className = "boss-img";
      if (imgInfo) {
        const img = document.createElement("img");
        img.src = `/assets/imgs/boss/${imgInfo.key}.${imgInfo.ext}`;
        img.alt = name;
        imgWrap.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = "?";
        imgWrap.appendChild(placeholder);
      }
      card.appendChild(imgWrap);

      const nameEl = document.createElement("div");
      nameEl.className = "boss-name";
      nameEl.textContent = name;
      card.appendChild(nameEl);

      const badge = document.createElement("span");
      badge.className = "boss-badge";
      badge.textContent = isDefeated ? "已击败" : "未击败";
      card.appendChild(badge);

      grid.appendChild(card);
    });
  </script>
</body>
</html>
