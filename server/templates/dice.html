<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 掷骰子结果</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero — coral rule + eyebrow + serif title). */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .owner-bar {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: var(--color-muted-soft);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .owner-meta {
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
      min-width: 0;
    }

    .owner-name {
      color: var(--color-ink);
      font-weight: 500;
    }

    .owner-id {
      color: var(--color-muted);
      font-family: var(--font-code);
    }

    .meta-divider {
      color: var(--color-hairline);
    }

    .meta-value {
      color: var(--color-ink);
      font-feature-settings: "tnum";
    }

    /* ── Stats tiles (5 across: choice + 4 numeric stats, cream-card). ─ */
    .stats-tiles {
      display: grid;
      gap: var(--space-sm);
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .stat-tile {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stat-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-feature-settings: "tnum";
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .stat-value.gain { color: var(--color-accent-teal); }
    .stat-value.loss { color: var(--color-primary); }

    /* ── Dice display (sits directly on canvas, no card wrap). ── */
    .dice-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
    }

    .dice-row {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
    }

    .dice-face {
      width: 100px;
      height: 100px;
      background-color: var(--color-surface-cream-strong);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dice-face.is-triple {
      box-shadow: inset 0 0 0 2px var(--color-accent-amber);
    }

    .dice-sum {
      display: flex;
      align-items: baseline;
      gap: var(--space-sm);
      justify-content: center;
      color: var(--color-ink);
      margin: 0;
    }

    .dice-sum-numbers {
      font-family: var(--font-code);
      font-weight: 400;
      color: var(--color-body-strong);
    }

    .dice-sum-equals {
      font-family: var(--font-code);
      color: var(--color-muted);
      font-weight: 400;
    }

    .dice-sum-total {
      font-family: var(--font-code);
      font-weight: 400;
      color: var(--color-ink);
    }

    .dice-sum-label {
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      font-weight: 500;
      color: var(--color-muted);
    }

    .dice-sum-label.is-triple {
      color: var(--color-primary);
    }

    /* ── Dice result (text label below the dice, single line). ── */
    .dice-result {
      font-family: var(--font-display);
      font-size: var(--type-display-sm-size, 28px);
      font-weight: 400;
      letter-spacing: -0.3px;
      line-height: 1.2;
      text-align: center;
      color: var(--color-muted);
      margin: 0;
    }

    .dice-result.dice-result-win { color: var(--color-primary); }
    .dice-result.dice-result-triple-win { color: var(--color-primary); }
    .dice-result.dice-result-triple-win .dice-result-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      background-color: var(--color-accent-amber);
      margin-right: var(--space-xs);
      vertical-align: middle;
    }
    .dice-result.dice-result-triple-kill { color: var(--color-body-strong); }
    .dice-result.dice-result-tie { color: var(--color-muted); }
    .dice-result.dice-result-lose { color: var(--color-muted); }

    /* ── Cap warning ───────────────────────────────────────────── */
    .cap-warning {
      color: var(--color-warning, var(--color-accent-amber));
      text-align: center;
    }

    /* ── Footer ────────────────────────────────────────────────── */
    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }

    /* Fallback state when JSON payload fails to parse. */
    body.fallback .page {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 class="header-title type-display-lg">掷骰子</h1>
      <div class="owner-bar">
        <img id="dice-avatar" class="avatar" alt="avatar" />
        <div class="owner-meta type-body-sm">
          <span class="owner-name" id="dice-owner-name"></span>
          <span class="owner-id" id="dice-owner-id"></span>
          <span class="meta-divider">·</span>
          <span id="generated-at"></span>
        </div>
      </div>
    </header>

    <section class="stats-tiles">
      <div class="stat-tile">
        <span class="stat-label">你的选择</span>
        <span class="stat-value" id="meta-choice"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">投入</span>
        <span class="stat-value loss" id="sum-cost"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">实际获得</span>
        <span class="stat-value" id="sum-payout"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">净赚</span>
        <span class="stat-value" id="sum-net"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">当前金币</span>
        <span class="stat-value" id="sum-coins"></span>
      </div>
    </section>

    <section class="dice-display">
      <div class="dice-row" id="dice-row"></div>
      <div class="dice-sum type-display-md">
        <span class="dice-sum-numbers" id="dice-sum-numbers"></span>
        <span class="dice-sum-equals">=</span>
        <span class="dice-sum-total" id="dice-sum-total"></span>
        <span class="dice-sum-label" id="dice-sum-label"></span>
      </div>
      <div class="dice-result" id="dice-result"></div>
    </section>

    <div id="cap-warning" class="cap-warning type-caption" hidden></div>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="dice-data" type="application/json">__DICE_DATA_JSON__</script>
  <script>
    (function () {
      let data;
      try {
        data = JSON.parse(document.getElementById("dice-data").textContent);
      } catch (err) {
        console.warn("[dice] page data unavailable", err);
        document.body.classList.add("fallback");
        return;
      }

      const playerName = String(data.player_name || "").trim() || "—";
      const playerQq = String(data.player_qq || "").trim() || "—";
      const choice = String(data.choice || "").trim() || "—";
      const cost = Number(data.cost || 0);
      const diceArr = Array.isArray(data.dice) ? data.dice.slice(0, 3) : [];
      while (diceArr.length < 3) diceArr.push(1);
      const total = Number(data.total || 0);
      const isTriple = Boolean(data.is_triple);
      const resultKind = String(data.result_kind || "lose");
      const payout = Number(data.payout || 0);
      const appliedPayout = Number(data.applied_payout || 0);
      const appliedNet = Number(data.applied_net || 0);
      const finalCoins = Number(data.final_coins || 0);
      const capped = Boolean(data.capped);
      const generatedAt = String(data.generated_at || "");

      // ── Header meta ────────────────────────────────────────
      document.getElementById("dice-avatar").src =
        `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(playerQq)}&s=100`;
      document.getElementById("dice-owner-name").textContent = playerName || "未知玩家";
      document.getElementById("dice-owner-id").textContent = playerQq ? `(${playerQq})` : "";
      document.getElementById("meta-choice").textContent = choice;
      document.getElementById("generated-at").textContent = generatedAt;

      // ── Stats tiles ────────────────────────────────────────
      document.getElementById("sum-cost").textContent = `− ${cost}`;
      document.getElementById("sum-payout").textContent = String(appliedPayout);

      const netEl = document.getElementById("sum-net");
      netEl.classList.remove("gain", "loss");
      if (appliedNet > 0) {
        netEl.textContent = `+ ${appliedNet}`;
        netEl.classList.add("gain");
      } else if (appliedNet < 0) {
        netEl.textContent = `− ${Math.abs(appliedNet)}`;
        netEl.classList.add("loss");
      } else {
        netEl.textContent = "0";
      }

      document.getElementById("sum-coins").textContent = String(finalCoins);

      // ── Dice display ───────────────────────────────────────
      // 5x5 dot-position grid (cx,cy in 0..4 indices).
      // Maps each face value (1..6) to the dot offsets within the face.
      const DOT_POSITIONS = {
        1: [[2, 2]],
        2: [[1, 1], [3, 3]],
        3: [[1, 1], [2, 2], [3, 3]],
        4: [[1, 1], [3, 1], [1, 3], [3, 3]],
        5: [[1, 1], [3, 1], [2, 2], [1, 3], [3, 3]],
        6: [[1, 1], [3, 1], [1, 2], [3, 2], [1, 3], [3, 3]],
      };
      const FACE_SIZE = 90;
      const CELL = FACE_SIZE / 5; // 18
      const DOT_RADIUS = 6;
      const SVG_NS = "http://www.w3.org/2000/svg";

      function renderDiceFace(value) {
        const v = Math.min(6, Math.max(1, Math.round(Number(value) || 1)));
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("width", String(FACE_SIZE));
        svg.setAttribute("height", String(FACE_SIZE));
        svg.setAttribute("viewBox", `0 0 ${FACE_SIZE} ${FACE_SIZE}`);
        const positions = DOT_POSITIONS[v] || DOT_POSITIONS[1];
        for (const [gx, gy] of positions) {
          const dot = document.createElementNS(SVG_NS, "circle");
          dot.setAttribute("cx", String(gx * CELL + CELL / 2));
          dot.setAttribute("cy", String(gy * CELL + CELL / 2));
          dot.setAttribute("r", String(DOT_RADIUS));
          dot.setAttribute("fill", "var(--color-ink)");
          svg.appendChild(dot);
        }
        return svg;
      }

      const diceRowEl = document.getElementById("dice-row");
      for (let i = 0; i < 3; i++) {
        const face = document.createElement("div");
        face.className = "dice-face";
        face.id = `dice-${i + 1}`;
        if (isTriple) face.classList.add("is-triple");
        face.appendChild(renderDiceFace(diceArr[i]));
        diceRowEl.appendChild(face);
      }

      // dice-sum
      document.getElementById("dice-sum-numbers").textContent =
        `${diceArr[0]} + ${diceArr[1]} + ${diceArr[2]}`;
      document.getElementById("dice-sum-total").textContent = String(total);

      const sumLabelEl = document.getElementById("dice-sum-label");
      if (isTriple) {
        sumLabelEl.textContent = "（豹子）";
        sumLabelEl.classList.add("is-triple");
      } else if (total >= 11) {
        sumLabelEl.textContent = "（大）";
      } else {
        sumLabelEl.textContent = "（小）";
      }

      // ── Dice result ────────────────────────────────────────
      const resultEl = document.getElementById("dice-result");
      const RESULT_PRESETS = {
        win: { cls: "dice-result-win", text: "猜对了" },
        triple_win: { cls: "dice-result-triple-win", text: "豹子！", dot: true },
        triple_kill: { cls: "dice-result-triple-kill", text: "豹子通杀" },
        lose: { cls: "dice-result-lose", text: "猜错了" },
        tie: { cls: "dice-result-tie", text: "刚好持平" },
      };
      const preset = RESULT_PRESETS[resultKind] || RESULT_PRESETS.lose;
      resultEl.classList.add(preset.cls);
      if (preset.dot) {
        const dot = document.createElement("span");
        dot.className = "dice-result-dot";
        resultEl.appendChild(dot);
      }
      const textSpan = document.createElement("span");
      textSpan.textContent = preset.text;
      resultEl.appendChild(textSpan);

      // ── Cap warning ────────────────────────────────────────
      if (capped && appliedPayout < payout) {
        const capEl = document.getElementById("cap-warning");
        const missing = payout - appliedPayout;
        capEl.textContent = `⚠️ 已触账户上限，理论派奖 ${payout}，${missing} 金币未入账`;
        capEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
