<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 关于</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    /* ── Hero (project tagline + tech badges, no gradient bg) ─ */
    .hero {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      text-align: center;
    }

    .hero-logo {
      width: 180px;
      height: auto;
      object-fit: contain;
    }

    .hero-name {
      color: var(--color-ink);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 36px;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .hero-desc {
      color: var(--color-muted);
      font-size: var(--type-body-md-size);
      max-width: 520px;
    }

    .badges {
      display: flex;
      gap: var(--space-xs);
      flex-wrap: wrap;
      justify-content: center;
      margin-top: var(--space-xs);
    }

    .badge {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border: 1px solid var(--color-accent-teal);
      border-radius: var(--radius-pill);
      padding: 2px var(--space-sm);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* ── Section card (cream-card with title + content) ───── */
    .section {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .section-title {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-md) var(--space-lg);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .info-label {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 500;
    }

    .info-value {
      color: var(--color-ink);
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-value.code {
      font-family: var(--font-code);
      font-feature-settings: "tnum";
    }

    .info-link {
      color: var(--color-primary);
      text-decoration: none;
    }

    /* ── Thanks grid ──────────────────────────────────────── */
    .thanks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-sm);
    }

    .thanks-card {
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .thanks-avatar {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .thanks-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .thanks-name {
      color: var(--color-ink);
      font-weight: 500;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thanks-qq {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
      font-size: 11px;
      font-feature-settings: "tnum";
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div class="header-eyebrow type-caption-uppercase">系统功能</div>
      <h1 class="header-title type-display-lg">关于</h1>
      <div class="header-meta type-body-sm">
        <span id="meta-time"></span>
      </div>
    </header>

    <section class="hero">
      <img id="hero-logo" class="hero-logo" alt="Logo" />
      <div class="hero-name" id="hero-name"></div>
      <div class="hero-desc" id="hero-desc"></div>
      <div class="badges">
        <span class="badge">NoneBot2</span>
        <span class="badge">OneBot V11</span>
      </div>
    </section>

    <section class="section">
      <div class="section-title">项目信息</div>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">作者</span>
          <a id="info-author" class="info-value info-link" href="#"></a>
        </div>
        <div class="info-item">
          <span class="info-label">仓库</span>
          <a id="info-repo" class="info-value info-link" href="#"></a>
        </div>
        <div class="info-item">
          <span class="info-label">框架</span>
          <span class="info-value">NoneBot2</span>
        </div>
        <div class="info-item">
          <span class="info-label">许可证</span>
          <span class="info-value">AGPL-3.0</span>
        </div>
        <div class="info-item">
          <span class="info-label">QQ 交流群</span>
          <span class="info-value code">1091215316</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">特别感谢</div>
      <div id="thanks-grid" class="thanks-grid"></div>
    </section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="page-data" type="application/json">__ABOUT_DATA_JSON__</script>
  <script>
    const data = (() => {
      try { return JSON.parse(document.getElementById("page-data").textContent); }
      catch (err) { console.warn("[render] page data unavailable", err); return {}; }
    })();

    document.getElementById("meta-time").textContent = data.generated_at || "";

    // Hero — always use light logo (no theme switching).
    document.getElementById("hero-logo").src = "/assets/imgs/logo-light.png";
    document.getElementById("hero-name").textContent = data.project_name || "NextBot";
    document.getElementById("hero-desc").textContent = data.project_desc || "";

    // Defensive: only allow http(s) URLs for outbound anchors; reject
    // javascript:/data:/etc. The current payload is hardcoded but this
    // guard makes the template safe if the payload is ever opened up.
    const safeHttpUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : "#");

    const authorEl = document.getElementById("info-author");
    authorEl.textContent = data.author || "";
    authorEl.href = safeHttpUrl(data.author_url);

    const repoEl = document.getElementById("info-repo");
    const repoUrl = data.project_url || "";
    repoEl.textContent = repoUrl;
    repoEl.href = safeHttpUrl(repoUrl);

    function maskQQ(qq) {
      if (!qq || qq.length <= 4) return qq || "";
      const middle = qq.length - 4;
      return qq.slice(0, 2) + "*".repeat(middle) + qq.slice(-2);
    }

    const thanksGrid = document.getElementById("thanks-grid");
    (data.thanks || []).forEach((t) => {
      const card = document.createElement("div");
      card.className = "thanks-card";

      const img = document.createElement("img");
      img.className = "thanks-avatar";
      img.src = `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(t.qq)}&s=100`;
      img.alt = "";
      card.appendChild(img);

      const info = document.createElement("div");
      info.className = "thanks-info";
      const nameEl = document.createElement("div");
      nameEl.className = "thanks-name";
      nameEl.textContent = t.name || "";
      const qqEl = document.createElement("div");
      qqEl.className = "thanks-qq";
      qqEl.textContent = maskQQ(t.qq);
      info.appendChild(nameEl);
      info.appendChild(qqEl);

      card.appendChild(info);
      thanksGrid.appendChild(card);
    });
  </script>
</body>
</html>
