<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 用户背包</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root { --cell: 52px; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 1900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero) ────────────────────────────────── */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .owner-bar {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: var(--color-muted-soft);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .owner-meta {
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
      min-width: 0;
    }

    .owner-name {
      color: var(--color-ink);
      font-weight: 500;
    }

    .owner-id {
      color: var(--color-muted);
      font-family: var(--font-code);
    }

    .meta-divider {
      color: var(--color-hairline);
    }

    /* ── Stats tiles (6-up cream-card grid) ────────────────── */
    .stats-tiles {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    .stat-tile {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stat-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-feature-settings: "tnum";
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Section rows: each row scrolls horizontally if needed ─ */
    .section-rows {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .section-row {
      display: flex;
      gap: var(--space-md);
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* Sub-stack: vertically stack two related sections. */
    .section-stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    /* ── Section card (cream-card preserved as visual boundary
     * between distinct inventory zones; gradient stripe and
     * box-shadow stripped). ─────────────────────────────────── */
    .section {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      width: fit-content;
    }

    /* 4-tier semantic mapping per section family */
    .section.family-equip { border-color: var(--color-accent-teal); }
    .section.family-resource { border-color: var(--color-accent-amber); }
    .section.family-trash {
      background-color: var(--color-surface-soft);
      border: 1px dashed var(--color-hairline);
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-md);
      padding: var(--space-xs) var(--space-md);
      border-bottom: 1px solid var(--color-hairline);
    }

    .section.family-trash .section-head { border-bottom-style: dashed; }

    .section-title {
      color: var(--color-ink);
      font-weight: 500;
      font-size: 13px;
    }

    .section-count {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 500;
      font-feature-settings: "tnum";
    }

    .section-body {
      padding: var(--space-sm);
    }

    .grid {
      display: grid;
      gap: 6px;
    }

    /* ── Cells ─────────────────────────────────────────────── */
    .cell {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      border-radius: var(--radius-sm);
    }

    .cell.occupied {
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
    }

    .cell.empty {
      background-color: var(--color-canvas);
      border: 1px dashed var(--color-hairline);
    }

    .slot-index {
      position: absolute;
      left: 4px;
      top: 2px;
      color: var(--color-muted-soft);
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 500;
      font-feature-settings: "tnum";
      z-index: 1;
    }

    .cell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      image-rendering: pixelated;
    }

    .stack-tag {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background-color: var(--color-surface-card);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-sm);
      padding: 0 4px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      font-feature-settings: "tnum";
      line-height: 1.4;
      z-index: 1;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div class="header-eyebrow type-caption-uppercase">玩家查询</div>
      <h1 class="header-title type-display-lg">用户背包</h1>
      <div class="owner-bar">
        <img id="wh-avatar" class="avatar" alt="avatar" />
        <div class="owner-meta type-body-sm">
          <span class="owner-name" id="meta-user-name"></span>
          <span class="owner-id" id="meta-user-id"></span>
          <span class="meta-divider" id="server-divider" hidden>·</span>
          <span id="meta-server" hidden></span>
          <span class="meta-divider">·</span>
          <span id="meta-time"></span>
        </div>
      </div>
    </header>

    <section id="stats-tiles" class="stats-tiles">
      <div class="stat-tile">
        <span class="stat-label">生命值</span>
        <span class="stat-value" id="meta-life"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">魔力值</span>
        <span class="stat-value" id="meta-mana"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">渔夫任务</span>
        <span class="stat-value" id="meta-fishing-tasks"></span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">PVE / PVP 死亡</span>
        <span class="stat-value" id="meta-deaths"></span>
      </div>
      <div class="stat-tile" id="tile-online-time">
        <span class="stat-label">在线时长</span>
        <span class="stat-value" id="meta-online-time"></span>
      </div>
      <div class="stat-tile" id="tile-map-exploration">
        <span class="stat-label">地图探索率</span>
        <span class="stat-value" id="meta-map-exploration"></span>
      </div>
    </section>

    <section id="section-rows" class="section-rows"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="inventory-data" type="application/json">__INVENTORY_DATA_JSON__</script>
  <script>
    (async function () {
      const data = (() => {
        try { return JSON.parse(document.getElementById("inventory-data").textContent); }
        catch (err) { console.warn("[render] page data unavailable", err); return {}; }
      })();

      // ── Header / owner bar ─────────────────────────────────
      const userId = String(data.user_id || "");
      document.getElementById("wh-avatar").src =
        `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(userId)}&s=100`;
      document.getElementById("meta-user-name").textContent = data.user_name || "未知玩家";
      document.getElementById("meta-user-id").textContent = userId ? `(${userId})` : "";
      const serverName = String(data.server_name || "").trim();
      if (serverName) {
        document.getElementById("server-divider").hidden = false;
        const ms = document.getElementById("meta-server");
        ms.hidden = false;
        ms.textContent = serverName;
      }
      document.getElementById("meta-time").textContent = data.generated_at || "";

      // ── Stats tiles ────────────────────────────────────────
      const showStats = Boolean(data.show_stats ?? true);
      if (!showStats) document.getElementById("stats-tiles").hidden = true;

      document.getElementById("meta-life").textContent = data.life_text || "—";
      document.getElementById("meta-mana").textContent = data.mana_text || "—";
      document.getElementById("meta-fishing-tasks").textContent = data.fishing_tasks_text || "—";
      // Combine PVE / PVP deaths in one tile so layout stays 5-up; show as
      // "PVE / PVP" pair to preserve information.
      const pve = data.pve_deaths_text || "0";
      const pvp = data.pvp_deaths_text || "0";
      document.getElementById("meta-deaths").textContent = `${pve} / ${pvp}`;
      const onlineText = String(data.online_time_text || "").trim();
      if (onlineText) {
        document.getElementById("meta-online-time").textContent = onlineText;
      } else {
        document.getElementById("tile-online-time").hidden = true;
      }
      const mapExplorationText = String(data.map_exploration_text || "").trim();
      if (mapExplorationText) {
        document.getElementById("meta-map-exploration").textContent = mapExplorationText;
      } else {
        document.getElementById("tile-map-exploration").hidden = true;
      }

      // ── Section / cell rendering ───────────────────────────
      const slots = Array.isArray(data.slots) ? data.slots : [];
      const showIndex = Boolean(data.show_index ?? true);

      const itemNameMap = new Map();
      const prefixNameMap = new Map();
      try {
        const [itemRes, prefixRes] = await Promise.all([
          fetch("/assets/dicts/item.json"),
          fetch("/assets/dicts/prefix.json"),
        ]);
        if (itemRes.ok) {
          const list = await itemRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) itemNameMap.set(id, name);
          });
        }
        if (prefixRes.ok) {
          const list = await prefixRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) prefixNameMap.set(id, name);
          });
        }
      } catch (e) { /* dict fetch failed → fall back to numeric ids */ }

      function range(start, end) {
        const out = [];
        for (let i = start; i <= end; i += 1) out.push(i);
        return out;
      }

      const sections = [
        { id: "main",       title: "主背包",                indices: range(0, 49),    cols: 10, family: "" },
        { id: "ammo_1",     title: "货币",                  indices: range(50, 53),   cols: 1,  family: "resource" },
        { id: "ammo_2",     title: "弹药",                  indices: range(54, 57),   cols: 1,  family: "resource" },
        { id: "loadout_1",  title: "第一套装备/饰品/染料",  indices: range(59, 88),   cols: 3,  family: "equip" },
        { id: "misc_equip", title: "饰品",                  indices: range(89, 93),   cols: 1,  family: "equip" },
        { id: "misc_dye",   title: "染料",                  indices: range(94, 98),   cols: 1,  family: "equip" },
        { id: "piggy",      title: "猪猪存钱罐",            indices: range(99, 138),  cols: 10, family: "" },
        { id: "safe",       title: "保险箱",                indices: range(139, 178), cols: 10, family: "" },
        { id: "trash",      title: "垃圾桶",                indices: [179],           cols: 1,  family: "trash" },
        { id: "forge",      title: "护卫熔炉",              indices: range(180, 219), cols: 10, family: "" },
        { id: "void",       title: "虚空袋",                indices: range(220, 259), cols: 10, family: "" },
        { id: "loadout_2",  title: "第二套装备/饰品/染料",  indices: range(290, 319), cols: 3,  family: "equip" },
        { id: "loadout_3",  title: "第三套装备/饰品/染料",  indices: range(320, 349), cols: 3,  family: "equip" },
      ];
      const sectionById = Object.fromEntries(sections.map((s) => [s.id, s]));
      const sectionRowsConfig = [
        ["main", "piggy", "safe"],
        ["loadout_1", "loadout_2", "loadout_3", "misc_equip_stack", "misc_dye", "ammo_1", "ammo_2", "forge_stack"],
      ];

      function getSlot(index) {
        const raw = slots[index];
        const netId = Number(raw?.net_id || 0);
        const prefixId = Number(raw?.prefix_id || raw?.prefix || 0);
        const stack = Number(raw?.stack || 0);
        return {
          index,
          netId: netId > 0 ? netId : 0,
          prefixId: prefixId > 0 ? prefixId : 0,
          stack: stack > 0 ? stack : 0,
        };
      }

      function createCell(slot) {
        const occupied = slot.netId > 0;
        const cell = document.createElement("div");
        cell.className = "cell " + (occupied ? "occupied" : "empty");
        if (showIndex) {
          const idx = document.createElement("span");
          idx.className = "slot-index";
          idx.textContent = String(slot.index);
          cell.appendChild(idx);
        }
        if (occupied) {
          const img = document.createElement("img");
          img.src = `/assets/items/Item_${slot.netId}.png`;
          img.alt = `Item ${slot.netId}`;
          img.loading = "lazy";
          cell.appendChild(img);
        }
        if (slot.stack > 1) {
          const tag = document.createElement("span");
          tag.className = "stack-tag";
          tag.textContent = String(slot.stack);
          cell.appendChild(tag);
        }
        return cell;
      }

      function createSectionCard(section) {
        const sectionSlots = section.indices.map(getSlot);
        const used = sectionSlots.filter((s) => s.netId > 0).length;

        const card = document.createElement("article");
        card.className = "section" + (section.family ? ` family-${section.family}` : "");

        const head = document.createElement("header");
        head.className = "section-head";
        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = section.title;
        const count = document.createElement("span");
        count.className = "section-count";
        count.textContent = `${used} / ${sectionSlots.length}`;
        head.appendChild(title);
        head.appendChild(count);
        card.appendChild(head);

        const body = document.createElement("div");
        body.className = "section-body";
        const grid = document.createElement("div");
        grid.className = "grid";
        grid.style.gridTemplateColumns = `repeat(${section.cols}, var(--cell))`;
        sectionSlots.forEach((slot) => grid.appendChild(createCell(slot)));
        body.appendChild(grid);
        card.appendChild(body);

        return { card, used, total: sectionSlots.length };
      }

      const sectionRowsEl = document.getElementById("section-rows");

      sectionRowsConfig.forEach((rowIds) => {
        const row = document.createElement("div");
        row.className = "section-row";
        rowIds.forEach((id) => {
          if (id === "forge_stack") {
            const wrap = document.createElement("div");
            wrap.className = "section-stack";
            wrap.appendChild(createSectionCard(sectionById.forge).card);
            wrap.appendChild(createSectionCard(sectionById.void).card);
            row.appendChild(wrap);
            return;
          }
          if (id === "misc_equip_stack") {
            const wrap = document.createElement("div");
            wrap.className = "section-stack";
            wrap.appendChild(createSectionCard(sectionById.misc_equip).card);
            wrap.appendChild(createSectionCard(sectionById.trash).card);
            row.appendChild(wrap);
            return;
          }
          const section = sectionById[id];
          if (!section) return;
          row.appendChild(createSectionCard(section).card);
        });
        sectionRowsEl.appendChild(row);
      });
    })();
  </script>
</body>
</html>
