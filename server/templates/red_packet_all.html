<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 红包列表</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* class selectors with display:flex/grid override the UA [hidden]
     * default; restore it explicitly so hidden sections truly disappear. */
    [hidden] { display: none !important; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-only hero — keep coral rule) ─────────── */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    /* ── Empty state ───────────────────────────────────────── */
    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    /* ── Entry list (each entry is its own cream-card) ─────── */
    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .entry {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      object-fit: cover;
      flex-shrink: 0;
    }

    .entry-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-xxs);
    }

    .entry-top {
      display: flex;
      /* center, not baseline: small-font pills baseline-align below the name's
       * visual midline because of the size difference, looking like they've
       * dropped. center keeps pills optically beside the name. */
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .entry-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .type-pill {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
    }

    .entry-cmd {
      font-family: var(--font-code);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-muted);
      font-feature-settings: "tnum";
      white-space: nowrap;
      flex-shrink: 0;
      padding-left: var(--space-md);
    }

    .sender {
      color: var(--color-muted);
    }

    .sender-id {
      color: var(--color-muted-soft);
      font-family: var(--font-code);
    }

    .stats {
      display: flex;
      gap: var(--space-lg);
      flex-shrink: 0;
      align-items: center;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stat-label {
      color: var(--color-muted);
    }

    .stat-value {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 18px;
      line-height: 1.2;
      color: var(--color-ink);
      font-feature-settings: "tnum";
      /* R5-5.0：对齐 R4 M5 模板（lottery_result.html / user_info.html）。
       * stat-value 显示 `${remainingAmount} / ${totalAmount}` 在 100 亿 cap 下可达
       * "10000000000 / 10000000000"（23 字符），窄卡片下可能溢出 stat 容器。
       * break-word 在 Chromium 对长数字串不可靠，用 break-all 强制换行。 */
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .stat-total {
      color: var(--color-muted);
      font-weight: 400;
      margin-left: 2px;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <h1 id="header-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span id="header-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>当前没有可抢的红包</div>

    <section id="list" class="list"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="rp-data" type="application/json">__RED_PACKET_ALL_DATA_JSON__</script>
  <script>
    const data = (() => {
      try { return JSON.parse(document.getElementById("rp-data").textContent); }
      catch (err) { console.warn("[render] page data unavailable", err); return {}; }
    })();
    const entries = Array.isArray(data.entries) ? data.entries : [];
    const page = Number(data.page || 1);
    const totalPages = Number(data.total_pages || 1);

    document.getElementById("header-title").textContent = "红包列表";
    document.getElementById("header-count").textContent = `${entries.length} 个红包`;
    document.getElementById("header-page").textContent = `第 ${page} / ${totalPages} 页`;
    document.getElementById("header-generated-at").textContent = data.generated_at || "";

    const listEl = document.getElementById("list");

    if (!entries.length) {
      document.getElementById("empty-state").hidden = false;
      listEl.hidden = true;
    }

    for (const entry of entries) {
      const name = String(entry?.name || "").trim() || "—";
      const senderName = String(entry?.sender_name || "").trim() || "未知";
      const senderId = String(entry?.sender_user_id || "").trim();
      const typeZh = String(entry?.type_zh || "").trim() || "红包";
      const remainingAmount = Number(entry?.remaining_amount || 0);
      const totalAmount = Number(entry?.total_amount || 0);
      const remainingCount = Number(entry?.remaining_count || 0);
      const totalCount = Number(entry?.total_count || 0);

      const card = document.createElement("article");
      card.className = "entry";

      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.alt = "";
      avatar.src = `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(senderId)}&s=100`;
      card.appendChild(avatar);

      const info = document.createElement("div");
      info.className = "entry-info";

      const top = document.createElement("div");
      top.className = "entry-top";
      const nameEl = document.createElement("h2");
      nameEl.className = "entry-name type-title-md";
      nameEl.textContent = name;
      top.appendChild(nameEl);
      const typePill = document.createElement("span");
      typePill.className = "type-pill";
      typePill.textContent = typeZh;
      top.appendChild(typePill);

      info.appendChild(top);

      const senderRow = document.createElement("div");
      senderRow.className = "sender type-body-sm";
      senderRow.textContent = `来自 ${senderName}`;
      if (senderId) {
        const sep = document.createTextNode(" ");
        senderRow.appendChild(sep);
        const idSpan = document.createElement("span");
        idSpan.className = "sender-id";
        idSpan.textContent = `(${senderId})`;
        senderRow.appendChild(idSpan);
      }
      info.appendChild(senderRow);

      card.appendChild(info);

      const stats = document.createElement("div");
      stats.className = "stats";

      const amountStat = document.createElement("div");
      amountStat.className = "stat";
      const amountLabel = document.createElement("div");
      amountLabel.className = "stat-label type-caption-uppercase";
      amountLabel.textContent = "剩余金币";
      amountStat.appendChild(amountLabel);
      const amountVal = document.createElement("div");
      amountVal.className = "stat-value";
      amountVal.textContent = String(remainingAmount);
      const amountTotal = document.createElement("span");
      amountTotal.className = "stat-total";
      amountTotal.textContent = ` / ${totalAmount}`;
      amountVal.appendChild(amountTotal);
      amountStat.appendChild(amountVal);
      stats.appendChild(amountStat);

      const countStat = document.createElement("div");
      countStat.className = "stat";
      const countLabel = document.createElement("div");
      countLabel.className = "stat-label type-caption-uppercase";
      countLabel.textContent = "剩余份数";
      countStat.appendChild(countLabel);
      const countVal = document.createElement("div");
      countVal.className = "stat-value";
      countVal.textContent = String(remainingCount);
      const countTotal = document.createElement("span");
      countTotal.className = "stat-total";
      countTotal.textContent = ` / ${totalCount}`;
      countVal.appendChild(countTotal);
      countStat.appendChild(countVal);
      stats.appendChild(countStat);

      card.appendChild(stats);

      const cmdHint = document.createElement("span");
      cmdHint.className = "entry-cmd";
      cmdHint.textContent = `抢红包 ${name}`;
      card.appendChild(cmdHint);

      listEl.appendChild(card);
    }
  </script>
</body>
</html>
