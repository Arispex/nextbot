<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 我的红包</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .entry {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .entry-top {
      display: flex;
      /* center, not baseline: small-font pills baseline-align below the name's
       * visual midline because of the size difference, looking like they've
       * dropped. center keeps pills optically beside the name. */
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .entry-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* ── Pills ─────────────────────────────────────────────── */
    .type-pill,
    .status-pill {
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
    }

    .type-pill {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      border-color: var(--color-hairline);
    }

    /* Status semantic colors per DESIGN.md tokens. */
    .status-pill.status-active {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }
    .status-pill.status-exhausted {
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }
    .status-pill.status-withdrawn {
      background-color: var(--color-canvas);
      color: var(--color-warning);
      border-color: var(--color-warning);
    }

    /* ── Progress row ──────────────────────────────────────── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background-color: var(--color-hairline);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--color-accent-teal);
      border-radius: var(--radius-pill);
    }

    .progress-text {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      font-feature-settings: "tnum";
      white-space: nowrap;
    }

    .progress-total,
    .progress-label {
      color: var(--color-muted);
      font-weight: 400;
    }

    .meta-row {
      color: var(--color-muted-soft);
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div id="header-eyebrow" class="header-eyebrow type-caption-uppercase"></div>
      <h1 id="header-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span id="header-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-generated-at"></span>
      </div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>你还没发过红包</div>

    <section id="list" class="list"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="rp-data" type="application/json">__RED_PACKET_OWN_DATA_JSON__</script>
  <script>
    const data = JSON.parse(document.getElementById("rp-data").textContent);
    const entries = Array.isArray(data.entries) ? data.entries : [];
    const page = Number(data.page || 1);
    const totalPages = Number(data.total_pages || 1);

    document.getElementById("header-eyebrow").textContent = "红包系统";
    document.getElementById("header-title").textContent = "我的红包";
    document.getElementById("header-count").textContent = `${entries.length} 个红包`;
    document.getElementById("header-page").textContent = `第 ${page} / ${totalPages} 页`;
    document.getElementById("header-generated-at").textContent = data.generated_at || "";

    const listEl = document.getElementById("list");

    if (!entries.length) {
      document.getElementById("empty-state").hidden = false;
      listEl.hidden = true;
    }

    const STATUS_CLASS = {
      "进行中": "status-active",
      "已抢完": "status-exhausted",
      "已收回": "status-withdrawn",
    };

    for (const entry of entries) {
      const name = String(entry?.name || "").trim() || "—";
      const typeZh = String(entry?.type_zh || "").trim() || "红包";
      const totalAmount = Number(entry?.total_amount || 0);
      const taken = Number(entry?.taken || 0);
      const totalCount = Number(entry?.total_count || 0);
      const takenCount = Number(entry?.taken_count || 0);
      const statusZh = String(entry?.status_zh || "").trim();
      const created = String(entry?.created || "").trim();
      const pct = totalAmount > 0 ? Math.max(0, Math.min(100, (taken / totalAmount) * 100)) : 0;

      const card = document.createElement("article");
      card.className = "entry";

      // Top: name + type + status
      const top = document.createElement("div");
      top.className = "entry-top";
      const nameEl = document.createElement("h2");
      nameEl.className = "entry-name type-title-md";
      nameEl.textContent = name;
      top.appendChild(nameEl);
      const typePill = document.createElement("span");
      typePill.className = "type-pill";
      typePill.textContent = typeZh;
      top.appendChild(typePill);
      if (statusZh) {
        const statusPill = document.createElement("span");
        const statusCls = STATUS_CLASS[statusZh] || "status-active";
        statusPill.className = `status-pill ${statusCls}`;
        statusPill.textContent = statusZh;
        top.appendChild(statusPill);
      }
      card.appendChild(top);

      // Progress row
      const prog = document.createElement("div");
      prog.className = "progress-row";

      const bar = document.createElement("div");
      bar.className = "progress-bar";
      const fill = document.createElement("div");
      fill.className = "progress-fill";
      fill.style.width = `${pct}%`;
      bar.appendChild(fill);
      prog.appendChild(bar);

      const amountText = document.createElement("span");
      amountText.className = "progress-text";
      amountText.textContent = `已抢 ${taken}`;
      const amountTotal = document.createElement("span");
      amountTotal.className = "progress-total";
      amountTotal.textContent = ` / ${totalAmount}`;
      amountText.appendChild(amountTotal);
      prog.appendChild(amountText);

      const countText = document.createElement("span");
      countText.className = "progress-text";
      const countLbl = document.createElement("span");
      countLbl.className = "progress-label";
      countLbl.textContent = "份数 ";
      countText.appendChild(countLbl);
      countText.appendChild(document.createTextNode(String(takenCount)));
      const countTotal = document.createElement("span");
      countTotal.className = "progress-total";
      countTotal.textContent = ` / ${totalCount}`;
      countText.appendChild(countTotal);
      prog.appendChild(countText);

      card.appendChild(prog);

      // Created time (optional)
      if (created) {
        const meta = document.createElement("div");
        meta.className = "meta-row type-caption";
        meta.textContent = created;
        card.appendChild(meta);
      }

      listEl.appendChild(card);
    }
  </script>
</body>
</html>
