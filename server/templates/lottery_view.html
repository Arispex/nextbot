<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot 查看奖池</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <link rel="stylesheet" href="/assets/css/render-tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--type-body-md-size);
      line-height: 1.55;
      padding: var(--space-xxl) var(--space-xxl);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    /* ── Header (text-hero — coral rule + eyebrow + serif pool name).
     * Same pattern as shop_view: each lottery pool reads as an editorial
     * "pool profile" page; eyebrow keeps it consistent with lottery_list. */
    .header-rule {
      width: 64px;
      height: 4px;
      background-color: var(--color-primary);
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .header-eyebrow {
      color: var(--color-muted);
      margin-bottom: var(--space-xs);
    }

    .header-title {
      color: var(--color-ink);
      margin: 0 0 var(--space-md) 0;
    }

    .header-meta {
      color: var(--color-muted-soft);
      display: flex;
      gap: var(--space-md);
      align-items: baseline;
      flex-wrap: wrap;
    }

    .header-meta-divider {
      color: var(--color-hairline);
    }

    .meta-value {
      color: var(--color-ink);
      font-feature-settings: "tnum";
    }

    .pool-desc {
      color: var(--color-muted);
      font-size: var(--type-body-sm-size);
      margin-top: var(--space-xs);
      max-width: 760px;
    }

    .empty-state {
      border: 1px dashed var(--color-hairline);
      background-color: var(--color-surface-soft);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl);
      text-align: center;
      color: var(--color-muted);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .prize {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: flex;
      align-items: stretch;
      gap: var(--space-lg);
    }

    .prize-icon {
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
    }

    .prize-icon img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .prize-icon.mystery {
      border: 1px dashed var(--color-accent-amber);
      color: var(--color-accent-amber);
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
    }

    .prize-icon.command {
      color: var(--color-accent-amber);
      font-size: 28px;
      line-height: 1;
    }

    .prize-icon.coin-pos {
      color: var(--color-accent-teal);
      font-size: 28px;
      line-height: 1;
      font-weight: 600;
    }

    .prize-icon.coin-neg {
      color: var(--color-primary);
      font-size: 28px;
      line-height: 1;
      font-weight: 600;
    }

    .prize-mid {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .prize-head {
      display: flex;
      /* center for optical alignment of small pills with name baseline. */
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .prize-name {
      color: var(--color-ink);
      margin: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .kind-pill {
      border-radius: var(--radius-pill);
      padding: 2px var(--space-xs);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
      font-feature-settings: "tnum";
    }

    .kind-pill.kind-item,
    .kind-pill.kind-coin-pos {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    .kind-pill.kind-command {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    .kind-pill.kind-coin-neg {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    .prize-desc {
      color: var(--color-muted);
      font-size: var(--type-body-sm-size);
      line-height: 1.5;
    }

    .prize-meta {
      color: var(--color-muted);
      font-size: var(--type-caption-size);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .prize-meta-divider {
      color: var(--color-hairline);
    }

    .cmd-block {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-sm);
      font-family: var(--font-code);
      font-size: 12px;
      padding: 6px 10px;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: var(--space-xxs);
    }

    /* ── Tier chips: 4-tier semantic mapping per DESIGN.md ─── */
    .tier-chip {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
    }

    .tier-chip.tier-none,
    .tier-chip.tier-0, .tier-chip.tier-1, .tier-chip.tier-2,
    .tier-chip.tier-3, .tier-chip.tier-4, .tier-chip.tier-5 {
      background-color: var(--color-canvas);
      color: var(--color-muted);
      border-color: var(--color-hairline);
    }

    .tier-chip.tier-6, .tier-chip.tier-7, .tier-chip.tier-8,
    .tier-chip.tier-9, .tier-chip.tier-10 {
      background-color: var(--color-canvas);
      color: var(--color-accent-teal);
      border-color: var(--color-accent-teal);
    }

    .tier-chip.tier-11, .tier-chip.tier-12, .tier-chip.tier-13,
    .tier-chip.tier-14, .tier-chip.tier-15 {
      background-color: var(--color-canvas);
      color: var(--color-accent-amber);
      border-color: var(--color-accent-amber);
    }

    .tier-chip.tier-16, .tier-chip.tier-17, .tier-chip.tier-18,
    .tier-chip.tier-19, .tier-chip.tier-20 {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }

    /* ── Right column: probability ─────────────────────────── */
    .prize-right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 88px;
    }

    .prob {
      color: var(--color-primary);
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      font-feature-settings: "tnum";
    }

    .prob-unit {
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 500;
      margin-left: 2px;
    }

    .prob-label {
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .footer {
      text-align: right;
      color: var(--color-muted-soft);
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <div class="header-rule"></div>
      <div id="header-eyebrow" class="header-eyebrow type-caption-uppercase"></div>
      <h1 id="header-title" class="header-title type-display-lg"></h1>
      <div class="header-meta type-body-sm">
        <span>ID <span class="meta-value" id="pool-id"></span></span>
        <span class="header-meta-divider">·</span>
        <span id="header-count"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-cost"></span>
        <span class="header-meta-divider" id="miss-divider" hidden>·</span>
        <span id="header-miss" hidden></span>
        <span class="header-meta-divider">·</span>
        <span id="header-page"></span>
        <span class="header-meta-divider">·</span>
        <span id="header-generated-at"></span>
      </div>
      <div id="pool-desc" class="pool-desc" hidden></div>
    </header>

    <div id="empty-state" class="empty-state type-body-md" hidden>该奖池暂无奖品</div>

    <section id="prize-list" class="list"></section>

    <footer class="footer type-caption">Powered by NextBot</footer>
  </main>

  <script id="lottery-view-data" type="application/json">__LOTTERY_VIEW_DATA_JSON__</script>
  <script>
    (async function () {
      const data = JSON.parse(document.getElementById("lottery-view-data").textContent);
      const prizes = Array.isArray(data.prizes) ? data.prizes : [];
      const total = Number(data.total || prizes.length || 0);
      const totalPages = Number(data.total_pages || 1);
      const page = Number(data.page || 1);
      const cost = Number(data.cost_per_draw || 0);
      const missPct = Number(data.miss_probability || 0);

      document.getElementById("header-eyebrow").textContent = "抽奖系统";
      document.getElementById("header-title").textContent = String(data.pool_name || "未命名奖池").trim() || "未命名奖池";
      document.getElementById("pool-id").textContent = String(data.pool_id ?? "-");
      document.getElementById("header-count").textContent = `共 ${total} 件奖品`;
      document.getElementById("header-cost").textContent = `单抽 ${cost} 金币`;
      if (missPct > 0) {
        document.getElementById("miss-divider").hidden = false;
        const missEl = document.getElementById("header-miss");
        missEl.textContent = `未中奖率 ${missPct.toFixed(1)}%`;
        missEl.hidden = false;
      }
      document.getElementById("header-page").textContent = `第 ${page} / ${totalPages} 页`;
      document.getElementById("header-generated-at").textContent = data.generated_at || "";

      const descText = String(data.pool_description || "").trim();
      if (descText) {
        const descEl = document.getElementById("pool-desc");
        descEl.textContent = descText;
        descEl.hidden = false;
      }

      // Item / prefix dictionaries — fetched async, fallback to numeric ids.
      const itemNameMap = new Map();
      const prefixNameMap = new Map();
      try {
        const [itemRes, prefixRes] = await Promise.all([
          fetch("/assets/dicts/item.json"),
          fetch("/assets/dicts/prefix.json"),
        ]);
        if (itemRes.ok) {
          const list = await itemRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) itemNameMap.set(id, name);
          });
        }
        if (prefixRes.ok) {
          const list = await prefixRes.json();
          if (Array.isArray(list)) list.forEach((e) => {
            const id = Number(e?.id || 0);
            const name = String(e?.name || "").trim();
            if (id > 0 && name) prefixNameMap.set(id, name);
          });
        }
      } catch (e) { /* dict fetch failed → fall back to numeric ids */ }

      const listEl = document.getElementById("prize-list");

      if (!prizes.length) {
        document.getElementById("empty-state").hidden = false;
        listEl.hidden = true;
      }

      for (const p of prizes) {
        const row = document.createElement("article");
        row.className = "prize";

        // Left: icon (item / mystery / command / coin).
        const iconWrap = document.createElement("div");
        iconWrap.className = "prize-icon";
        const coinPositive = p.kind === "coin" && Number(p.coin_amount || 0) >= 0;
        if (p.kind === "item" && p.is_mystery) {
          iconWrap.classList.add("mystery");
          iconWrap.textContent = "?";
        } else if (p.kind === "item" && Number(p.item_id || 0) > 0) {
          const img = document.createElement("img");
          img.src = `/assets/items/Item_${p.item_id}.png`;
          img.alt = String(p.item_id);
          iconWrap.appendChild(img);
        } else if (p.kind === "command") {
          iconWrap.classList.add("command");
          iconWrap.textContent = "⚙";
        } else if (p.kind === "coin") {
          iconWrap.classList.add(coinPositive ? "coin-pos" : "coin-neg");
          iconWrap.textContent = coinPositive ? "+" : "−";
        }
        row.appendChild(iconWrap);

        // Middle: head + desc + meta + (optional) cmd block.
        const mid = document.createElement("div");
        mid.className = "prize-mid";

        const head = document.createElement("div");
        head.className = "prize-head";

        const nameEl = document.createElement("h2");
        nameEl.className = "prize-name type-title-md";
        nameEl.textContent = String(p?.name || "").trim() || "未命名";
        head.appendChild(nameEl);

        const kindLabel = (function () {
          if (p.kind === "item") return { text: "物品", cls: "kind-item" };
          if (p.kind === "command") return { text: "指令", cls: "kind-command" };
          return coinPositive
            ? { text: "金币奖励", cls: "kind-coin-pos" }
            : { text: "金币扣除", cls: "kind-coin-neg" };
        })();
        const kind = document.createElement("span");
        kind.className = `kind-pill ${kindLabel.cls}`;
        kind.textContent = kindLabel.text;
        head.appendChild(kind);

        mid.appendChild(head);

        const prizeDesc = String(p?.description || "").trim();
        if (prizeDesc) {
          const desc = document.createElement("div");
          desc.className = "prize-desc";
          desc.textContent = prizeDesc;
          mid.appendChild(desc);
        }

        const meta = document.createElement("div");
        meta.className = "prize-meta";

        if (p.kind === "item") {
          let nameStr;
          if (p.is_mystery) {
            nameStr = "? ? ?";
          } else {
            const itemName = itemNameMap.get(Number(p.item_id)) || `ID:${p.item_id}`;
            const prefixId = Number(p.prefix_id || 0);
            const prefixName = prefixId > 0 ? (prefixNameMap.get(prefixId) || `前缀 ID:${prefixId}`) : "";
            nameStr = prefixName ? `${prefixName} ${itemName}` : itemName;
          }
          const span = document.createElement("span");
          span.textContent = `${nameStr}  ·  数量 ×${p.quantity}`;
          meta.appendChild(span);
          if (p.min_tier_zh) {
            const sep = document.createElement("span");
            sep.className = "prize-meta-divider";
            sep.textContent = "·";
            meta.appendChild(sep);
            const chip = document.createElement("span");
            const rank = Number(p.min_tier_rank);
            chip.className = "tier-chip" + (rank >= 0 ? ` tier-${rank}` : " tier-none");
            chip.textContent = `进度：${p.min_tier_zh}`;
            meta.appendChild(chip);
          }
        } else if (p.kind === "command") {
          const span = document.createElement("span");
          span.textContent = `目标：${p.target_server_label || "全部服务器"}`;
          meta.appendChild(span);
        } else if (p.kind === "coin") {
          const amt = Number(p.coin_amount || 0);
          const span = document.createElement("span");
          span.textContent = (amt >= 0 ? `奖励 +${amt}` : `扣除 ${amt}`) + " 金币";
          meta.appendChild(span);
        }
        mid.appendChild(meta);

        if (p.kind === "command" && p.command_template) {
          const cmd = document.createElement("div");
          cmd.className = "cmd-block";
          cmd.textContent = p.command_template;
          mid.appendChild(cmd);
        }

        row.appendChild(mid);

        // Right: probability.
        const right = document.createElement("div");
        right.className = "prize-right";
        const probLbl = document.createElement("div");
        probLbl.className = "prob-label";
        probLbl.textContent = "概率";
        right.appendChild(probLbl);
        const prob = document.createElement("div");
        prob.className = "prob";
        prob.textContent = (Number(p.probability) || 0).toFixed(1);
        const probUnit = document.createElement("span");
        probUnit.className = "prob-unit";
        probUnit.textContent = "%";
        prob.appendChild(probUnit);
        right.appendChild(prob);

        row.appendChild(right);
        listEl.appendChild(row);
      }
    })();
  </script>
</body>
</html>
