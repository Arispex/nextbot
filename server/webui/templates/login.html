<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextBot WebUI · 登录</title>
  <link rel="stylesheet" href="/assets/css/render-fonts.css" />
  <script src="/webui/static/js/theme-init.js"></script>
  <script src="__WEBUI_API_SCRIPT_URL__"></script>
  <style>
    /* ── Tokens (mirror /webui/static/css/app-shell.css) ──── */
    :root {
      --bg-layout: #faf9f5;
      --surface: #efe9de;
      --surface-soft: #f5f0e8;
      --text: #141413;
      --text-muted: #6c6a64;
      --text-muted-soft: #8e8b82;
      --line: #e6dfd8;
      --line-strong: #d6cfc5;
      --primary: #cc785c;
      --primary-active: #a9583e;
      --primary-soft: #f5e7df;
      --on-primary: #ffffff;
      --accent-teal: #5db8a6;

      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-display: "Cormorant Garamond", "Tiempos Headline", "Garamond", "Songti SC", serif;
      --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-xxl: 48px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
    }

    html.dark {
      color-scheme: dark;
      --bg-layout: #181715;
      --surface: #22201d;
      --surface-soft: #1f1d1b;
      --text: #f5f4f0;
      --text-muted: #a39d92;
      --text-muted-soft: #7a7268;
      --line: #33312d;
      --line-strong: #44413c;
      --primary: #cc785c;
      --primary-active: #d68a72;
      --primary-soft: rgba(204, 120, 92, 0.18);
      --on-primary: #ffffff;
      --accent-teal: #6fc7b6;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background-color: var(--bg-layout);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Theme toggle (top-right) ────────────────────────── */
    .theme-toggle {
      position: fixed;
      top: var(--space-lg);
      right: var(--space-lg);
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background-color: var(--surface);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .theme-toggle:hover {
      color: var(--primary);
      border-color: var(--primary);
      background-color: var(--surface-soft);
    }

    .theme-toggle svg { width: 16px; height: 16px; }

    .theme-toggle .icon-sun { display: none; }
    html.dark .theme-toggle .icon-sun { display: block; }
    html.dark .theme-toggle .icon-moon { display: none; }

    /* ── Centered viewport + card ────────────────────────── */
    .viewport {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-xl);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-xxl) var(--space-xl) var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    /* ── Header (text-hero, mirrors render templates) ────── */
    .card-rule {
      width: 64px;
      height: 4px;
      background-color: var(--primary);
      border-radius: var(--radius-pill);
    }

    .card-eyebrow {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .card-title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 36px;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--text);
    }

    .card-lede {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── Form ─────────────────────────────────────────────── */
    .form {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .token-input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background-color: var(--bg-layout);
      color: var(--text);
      font-family: var(--font-code);
      font-size: 14px;
      padding: 0 var(--space-sm);
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .token-input:focus {
      border-color: var(--primary);
      background-color: var(--surface-soft);
    }

    .token-input::placeholder {
      color: var(--text-muted-soft);
      font-family: var(--font-body);
      opacity: 1;
    }

    .login-btn {
      width: 100%;
      height: 40px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-md);
      background-color: var(--primary);
      color: var(--on-primary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      margin-top: 4px;
    }

    .login-btn:hover {
      background-color: var(--primary-active);
      border-color: var(--primary-active);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Inline error (coral) ─────────────────────────────── */
    .login-error {
      border: 1px solid var(--primary);
      border-radius: var(--radius-md);
      background-color: var(--bg-layout);
      color: var(--primary);
      padding: var(--space-xs) var(--space-sm);
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: var(--text-muted-soft);
      font-size: 11px;
      letter-spacing: 0.04em;
      margin-top: var(--space-xs);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" class="theme-toggle" aria-label="切换主题">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3c0 .38.02.76.07 1.13A7 7 0 0 0 19.87 12c.37.05.75.07 1.13.07z"></path>
    </svg>
  </button>

  <main class="viewport">
    <section class="card">
      <header>
        <div class="card-rule"></div>
        <div class="card-eyebrow">NextBot WebUI</div>
        <h1 class="card-title">登录</h1>
        <p class="card-lede">输入访问 Token 进入管理后台。</p>
      </header>

      <div id="login-error" class="login-error hidden" role="alert" aria-live="polite"></div>

      <form id="login-form" class="form" novalidate>
        <input type="hidden" id="next-path" name="next" value="__NEXT_PATH__" />

        <div class="field">
          <label for="token" class="field-label">Token</label>
          <input
            id="token"
            name="token"
            type="password"
            autocomplete="off"
            placeholder="请输入访问 Token"
            class="token-input"
          />
        </div>

        <button type="submit" class="login-btn">登录</button>
      </form>

      <div class="footer">Powered by NextBot</div>
    </section>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const api = window.NextBotWebUIApi;
      const form = document.getElementById("login-form");
      const errorNode = document.getElementById("login-error");
      const nextPathInput = document.getElementById("next-path");
      const tokenInput = document.getElementById("token");
      const submitButton = form?.querySelector("button[type=\"submit\"]");

      if (toggle) {
        toggle.addEventListener("click", () => {
          const dark = root.classList.toggle("dark");
          try {
            localStorage.setItem("nextbot-webui-theme", dark ? "dark" : "light");
          } catch (error) {
            // Ignore storage errors.
          }
        });
      }

      if (!api || !form || !errorNode || !nextPathInput || !tokenInput || !submitButton) {
        return;
      }

      const setError = (message = "") => {
        const text = String(message || "").trim();
        errorNode.textContent = text;
        errorNode.classList.toggle("hidden", !text);
      };

      const setSubmitting = (submitting) => {
        submitButton.disabled = submitting;
        submitButton.textContent = submitting ? "登录中…" : "登录";
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setError("");
        setSubmitting(true);

        try {
          const payload = {
            token: String(tokenInput.value || ""),
            next: String(nextPathInput.value || ""),
          };
          const result = await api.apiRequest("/webui/api/session", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify(payload),
            action: "登录",
            expectedStatus: 201,
          });
          const data = api.unwrapData(result);
          const nextPath = typeof data?.next === "string" && data.next.trim() ? data.next : "/webui";
          window.location.assign(nextPath);
        } catch (error) {
          setError(error instanceof Error ? error.message : "登录失败");
        } finally {
          setSubmitting(false);
        }
      });
    })();
  </script>
</body>
</html>
